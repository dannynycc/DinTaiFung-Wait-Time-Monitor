<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼎泰豐全分店 — 候位監控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f5f0eb;
    color: #3a3a3a;
    padding: 20px 24px;
  }

  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 24px; color: #8b4513; letter-spacing: 2px; }
  header .sub { font-size: 12px; color: #999; margin-top: 4px; }
  header .date-picker {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 10px; font-size: 13px; color: #5a3a1a;
  }
  /* ── 日曆式日期選擇 ─────────────────────────────
     不用原生 <input type="date">：它的顯示語言跟瀏覽器走、不理頁面 lang，
     而且無法標示「哪些日期有資料」—— 那正是這裡的重點。 */
  .cal-wrap { position: relative; display: inline-block; }
  .cal-btn {
    font-family: inherit; font-size: 13px;
    padding: 5px 12px; border: 1px solid #d4c3aa;
    border-radius: 6px; background: #fff; color: #3a3a3a;
    cursor: pointer; min-width: 165px;
  }
  .cal-btn:hover { border-color: #b08860; }
  .cal-btn:focus-visible { outline: 2px solid #8b4513; }
  .cal-btn::after { content: ' ▾'; color: #b08860; }

  .cal-popup {
    position: absolute; z-index: 50; top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%);
    background: #fff; border: 1px solid #d4c3aa; border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.14);
    padding: 12px; width: 268px; text-align: center;
  }
  .cal-popup[hidden] { display: none; }

  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px; margin-bottom: 8px;
  }
  .cal-head select {
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: #8b4513; background: #fff;
    border: 1px solid #e4d9c9; border-radius: 6px;
    padding: 3px 6px; cursor: pointer; flex: 1;
  }
  .cal-nav {
    font-family: inherit; font-size: 16px; line-height: 1;
    width: 28px; height: 28px; flex: none;
    border: 1px solid #e4d9c9; border-radius: 6px;
    background: #fff; color: #8b4513; cursor: pointer;
  }
  .cal-nav:hover { background: #faf6f1; }

  .cal-dow, .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-dow span { font-size: 11px; color: #b08860; padding: 2px 0; }

  .cal-day {
    font-family: inherit; font-size: 12.5px;
    height: 30px; border: 1px solid transparent; border-radius: 6px;
    background: transparent; padding: 0;
  }
  /* 無資料：灰、不可點。用「能不能點」本身當作最直接的訊號。 */
  .cal-day.none { color: #d2cabe; cursor: default; }
  /* 有資料：實心淡底 + 深色字，一眼掃得出哪幾天有 */
  .cal-day.has {
    color: #5a3a1a; background: #f2e7d6; cursor: pointer; font-weight: 600;
  }
  .cal-day.has:hover { background: #e6d5bb; }
  .cal-day.today { border-color: #b08860; }
  .cal-day.sel { background: #8b4513; color: #fff; }
  .cal-day.sel:hover { background: #7a3d11; }
  .cal-day.empty { visibility: hidden; }

  .cal-foot {
    display: flex; justify-content: center; gap: 10px;
    margin-top: 10px; padding-top: 8px; border-top: 1px solid #f0e6d8;
    font-size: 10.5px; color: #999;
  }
  .cal-key { display: inline-flex; align-items: center; gap: 4px; }
  .cal-key i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .cal-key .k-has { background: #f2e7d6; }
  .cal-key .k-none { background: #f6f4f0; border: 1px solid #eee; }
  .cal-key .k-today { border: 1px solid #b08860; }

  /* 即時總覽卡片 */
  .overview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .store-card {
    background: #fff;
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
    transition: transform .15s;
    cursor: pointer;
  }
  .store-card:hover { transform: translateY(-2px); }
  .store-card .name {
    font-size: 13px; font-weight: 600;
    color: #5a3a1a; margin-bottom: 6px;
  }
  .store-card .wait { font-size: 28px; font-weight: 700; color: #8b4513; }
  .store-card .unit { font-size: 11px; color: #b08860; }
  .store-card .closed .wait { font-size: 14px; color: #bbb; }
  .store-card .stop-time {
    margin-top: 6px;
    font-size: 11px;
    color: #b08860;
    line-height: 1.3;
  }
  .store-card .stop-time .label { color: #999; }
  .store-card .stop-time.hot { color: #d32f2f; font-weight: 600; }
  .store-card .stop-time.warm { color: #f57c00; }
  .store-card .stop-time.unset { color: #ccc; font-style: italic; }
  .store-card.hot    { border-left: 4px solid #d32f2f; }
  .store-card.warm   { border-left: 4px solid #f57c00; }
  .store-card.cool   { border-left: 4px solid #388e3c; }
  .store-card.idle   { border-left: 4px solid #bbb; }
  .store-card.selected { outline: 3px solid #8b4513; outline-offset: -3px; }

  /* 圖表 */
  .chart-wrap {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
    margin-bottom: 24px;
  }
  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .chart-header h2 { font-size: 15px; color: #8b4513; }
  .chart-filter {
    display: flex; align-items: center; gap: 8px;
  }
  .chart-filter label { font-size: 12px; color: #999; }
  .chart-filter select {
    font-family: inherit; font-size: 13px;
    padding: 4px 10px; border: 1px solid #ddd;
    border-radius: 6px; background: #fff; color: #3a3a3a;
    cursor: pointer;
  }
  .chart-filter select:focus { outline: 2px solid #8b4513; }
  .chart-container { position: relative; width: 100%; height: 350px; }

  /* 表格 */
  .table-wrap {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
  }
  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .table-header h2 { font-size: 15px; color: #8b4513; }
  .table-header select {
    font-family: inherit; font-size: 13px;
    padding: 4px 10px; border: 1px solid #ddd;
    border-radius: 6px; background: #fff; color: #3a3a3a;
    cursor: pointer;
  }
  .table-header select:focus { outline: 2px solid #8b4513; }
  .scroll-box { max-height: 450px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    background: #8b4513; color: #fff;
    padding: 8px 10px; text-align: center;
    font-weight: 500; position: sticky; top: 0;
  }
  tbody tr:nth-child(even) { background: #faf6f1; }
  tbody tr:hover { background: #f0e6d8; }
  tbody td {
    padding: 6px 10px; text-align: center;
    border-bottom: 1px solid #eee; white-space: nowrap;
  }
  .td-wait { font-weight: 700; color: #8b4513; }
  .td-closed { color: #bbb; font-style: italic; }

  /* 疑似上游瞬間毛刺：照常列出（表格是稽核紀錄），只是淡化並加註記 */
  tbody tr.glitch-row { opacity: .55; }
  tbody tr.glitch-row td { text-decoration: line-through; text-decoration-color: #c9b8a0; }
  .glitch-mark {
    font-weight: 400;
    color: #b08860;
    text-decoration: none;
    cursor: help;
  }

  .refresh-info {
    text-align: center; font-size: 11px; color: #bbb; margin-top: 14px;
  }

  .site-footer {
    max-width: 760px;
    margin: 36px auto 8px;
    padding: 18px 22px;
    font-size: 12px;
    color: #8a7a66;
    line-height: 1.75;
    text-align: center;
    border-top: 1px solid #e4d9c9;
  }
  .site-footer a {
    color: #8b4513;
    text-decoration: none;
    border-bottom: 1px dotted #b08860;
  }
  .site-footer a:hover { border-bottom-style: solid; }
  .site-footer .row { margin: 2px 0; }
  .site-footer .license {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    border: 1px solid #d4c3aa;
    border-radius: 4px;
    font-size: 11px;
  }

  /* ── 桌機：全部分店強制排成一列 ──────────────────
     原本用 repeat(auto-fill, minmax(130px, 1fr))，auto-fill 只保證「塞得下幾欄
     就排幾欄」，1600px 剛好 11 欄、1440px 只有 9 欄就換行。改成明確指定欄數。
     --store-count 由 JS 依實際卡片數寫入，分店增減時不必改 CSS。
     欄變窄後內容也要跟著縮：實測最寬的一段文字是「已停止內用取號」98px @14px，
     1428px 視埠下每張卡內容區僅約 94px，不縮字會擠成兩行、卡片跟著變高。 */
  @media (min-width: 1160px) {
    .overview {
      grid-template-columns: repeat(var(--store-count, 11), minmax(0, 1fr));
      gap: 8px;
    }
    /* 字級用容器單位（cqw）而非 vw：卡片寬度會隨視窗一起縮，用 vw 的話比例固定，
       永遠差那零點幾 px 而換行（實測 1280px 時需要 89.6px、只有 89px 可用）。
       cqw 跟的是卡片自身寬度，gap 或 padding 之後再調也不會失準。
       13cqw 的來源：「已停止內用取號」7 個字，7 × 13% ≈ 91% 容器寬，留 9% 餘裕。 */
    .store-card {
      padding: 14px 6px;
      container-type: inline-size;
    }
    .store-card .closed .wait { font-size: clamp(9px, 13cqw, 14px); }
    .store-card .stop-time { font-size: clamp(8px, 10cqw, 11px); }
  }

  /* ── 平板 (≤ 900px) ─────────────────────────── */
  @media (max-width: 900px) {
    body { padding: 14px 14px; }
    header h1 { font-size: 20px; letter-spacing: 1px; }
    header .sub { font-size: 11px; }

    .overview {
      grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }
    .store-card { padding: 10px 6px; }
    .store-card .name { font-size: 12px; margin-bottom: 4px; }
    .store-card .wait { font-size: 22px; }

    .chart-wrap, .table-wrap { padding: 14px; border-radius: 10px; }
    .chart-container { height: 280px; }
    table { font-size: 11.5px; }
    thead th { padding: 6px 8px; }
    tbody td { padding: 5px 8px; }
  }

  /* ── 手機 (≤ 600px) ─────────────────────────── */
  @media (max-width: 600px) {
    body { padding: 10px 10px; }
    header { margin-bottom: 14px; }
    header h1 { font-size: 17px; letter-spacing: 0.5px; }
    header .sub { font-size: 10.5px; line-height: 1.5; }

    .overview {
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 6px;
      margin-bottom: 14px;
    }
    .store-card { padding: 8px 4px; border-radius: 8px; }
    .store-card .name { font-size: 11px; margin-bottom: 2px; }
    .store-card .wait { font-size: 20px; }
    .store-card .unit { font-size: 10px; }
    .store-card .closed .wait { font-size: 12px; }

    /* 圖表 / 表格容器縮小 padding */
    .chart-wrap, .table-wrap {
      padding: 12px 10px;
      margin-bottom: 14px;
      border-radius: 8px;
    }
    .chart-header, .table-header {
      gap: 6px; margin-bottom: 8px;
      flex-direction: column;
      align-items: flex-start;
    }
    .chart-header h2, .table-header h2 { font-size: 13px; }
    .chart-filter { width: 100%; justify-content: space-between; }
    .chart-filter select, .table-header select {
      font-size: 12px; padding: 3px 8px; flex: 1;
    }
    .chart-container { height: 240px; }

    /* 表格 — 隱藏次要欄位讓主要資訊可讀 */
    .col-togo { display: none; }
    table { font-size: 11px; }
    thead th { padding: 5px 4px; font-size: 10.5px; }
    tbody td { padding: 4px 4px; }
    .scroll-box { max-height: 360px; }

    .site-footer {
      margin-top: 22px;
      padding: 14px 14px;
      font-size: 11px;
      line-height: 1.65;
    }
    .site-footer .row { margin: 3px 0; }
  }

  /* ── 超小螢幕 (≤ 380px，iPhone SE) ──────────── */
  @media (max-width: 380px) {
    .overview {
      grid-template-columns: repeat(3, 1fr);
    }
    .store-card .wait { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <h1>鼎泰豐全分店 — 候位監控</h1>
  <div class="sub">資料每 60 秒更新（圖表為步階線，只在等候變化時跳）| 點卡片可篩選</div>
  <div class="date-picker">
    <label>日期：</label>
    <div class="cal-wrap">
      <button type="button" id="dateBtn" class="cal-btn" aria-haspopup="dialog" aria-expanded="false">—</button>
      <div id="calPopup" class="cal-popup" role="dialog" aria-label="選擇日期" hidden>
        <div class="cal-head">
          <button type="button" class="cal-nav" id="calPrev" aria-label="上個月">‹</button>
          <select id="calMonthSel" aria-label="快速跳到有資料的月份"></select>
          <button type="button" class="cal-nav" id="calNext" aria-label="下個月">›</button>
        </div>
        <div class="cal-dow"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-foot">
          <span class="cal-key"><i class="k-has"></i>有資料</span>
          <span class="cal-key"><i class="k-none"></i>無資料</span>
          <span class="cal-key"><i class="k-today"></i>今日</span>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="overview" id="overview"></div>

<div class="chart-wrap">
  <div class="chart-header">
    <h2>各分店等候時間趨勢</h2>
    <div class="chart-filter">
      <label>篩選分店:</label>
      <select id="chartFilter">
        <option value="__all__">全部分店</option>
      </select>
    </div>
  </div>
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="table-wrap">
  <div class="table-header">
    <h2>歷史紀錄</h2>
    <select id="tableFilter">
      <option value="__all__">全部分店</option>
    </select>
  </div>
  <div class="scroll-box">
    <table>
      <thead>
        <tr>
          <th>時間</th>
          <th>分店</th>
          <th>變化</th>
          <th>前值持續</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="refresh-info">
  上次更新: <span id="lastUpdate">-</span>
  &nbsp;|&nbsp; 總筆數: <span id="totalRows">0</span>
</div>

<footer class="site-footer">
  <div class="row">
    資料來源：<a href="https://www.dintaifung.tw/Queue/?type=3" target="_blank" rel="noopener">鼎泰豐官方候位查詢網頁</a>
  </div>
  <div class="row">
    本站為獨立開發專案，與鼎泰豐無任何關係，資料僅供參考。
  </div>
  <div class="row">
    候位紀錄為鼎泰豐官網公開資訊之事實觀測，本站不主張其著作權，歡迎自由取用。
  </div>
  <div class="row">
    回報問題：<a href="https://github.com/dannynycc/DinTaiFung-Wait-Time-Monitor/issues" target="_blank" rel="noopener">GitHub Issues</a>
  </div>
  <div class="row">
    <a class="license" href="https://github.com/dannynycc/DinTaiFung-Wait-Time-Monitor/blob/main/LICENSE" target="_blank" rel="noopener">程式碼 MIT 授權</a>
  </div>
</footer>

<script>
// ── 顏色配置 ─────────────────────────────────────
const STORE_COLORS = {
  '信義店': '#e53935', '復興店': '#8e24aa', '天母店': '#1e88e5',
  '新竹店': '#43a047', '101店':  '#f4511e', '台中店': '#00897b',
  '板橋店': '#fdd835', '高雄店': '#6d4c41', '南西店': '#d81b60',
  'A4店':   '#3949ab', 'A13店':  '#00acc1', '新生店': '#7cb342',
};
function storeColor(name) { return STORE_COLORS[name] || '#8b4513'; }

// ── 設定 ─────────────────────────────────────────
// 即時資料走 Cloudflare Worker，歷史資料走本 repo 的靜態檔（省 Worker 額度，
// 也讓歷史資料在 GitHub 上直接可下載）。
const API_BASE = 'https://dintaifung-queue.dannynycc.workers.dev';
const ARCHIVE_BASE = 'data';

// ── 狀態 ─────────────────────────────────────────
let allRows = [];
let knownStores = [];
let allStores = [];             // /api/stores 的權威分店清單（抓取失敗時卡片仍要出現）
let lastSeenByStore = {};       // 分店 → 最後一次成功抓取的時間戳（圖表延伸上限）
let selectedStore = '__all__';  // 圖表+表格+卡片 共用篩選
let archiveDates = new Set();   // 有靜態歷史檔的日期

// ── 台北時間 ─────────────────────────────────────
// 本機版可以直接用瀏覽器當地時間，因為看的人就在台灣、機器也在台灣。
// 上線成公開網頁後不行：資料庫時間戳全是台北時間，若用訪客的當地時間算「今天」，
// 倫敦的訪客早上會看到還沒開始的日期、東京的訪客半夜會提早跳到明天。
// 台灣自 1980 年起無日光節約時間，固定 UTC+8。
function taipeiNow() {
  return new Date(Date.now() + 8 * 3600 * 1000);
}
function todayStr() {
  return taipeiNow().toISOString().slice(0, 10);
}
function taipeiClock(d) {
  // 傳入已位移過的 Date，取出「台北牆上時鐘」的 HH:MM
  return String(d.getUTCHours()).padStart(2, '0') + ':' +
         String(d.getUTCMinutes()).padStart(2, '0');
}

let selectedDate = todayStr();  // YYYY-MM-DD

function dateLabel(dateStr) {
  const t = todayStr();
  if (dateStr === t) return `${dateStr}（今日）`;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(t + 'T00:00:00');
  const diff = Math.round((now - d) / 86400000);
  if (diff === 1) return `${dateStr}（昨日）`;
  if (diff === 2) return `${dateStr}（前日）`;
  const wd = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${dateStr}（週${wd}）`;
}

// ── Chart.js（含 hover 高亮 plugin）──────────────
//
// 效能：這段原本用 `chart.update('none')` 重繪，實測每次 6.54 ms，
// 而 interaction 是 { intersect: false, mode: 'nearest' } —— 滑鼠一移動，
// 「最近的資料集」就在 11 條線之間跳，導致幾乎每兩次 mousemove 就全圖重繪一次。
// 掃過圖表一次量到 240 次 update、合計 1722 ms 主執行緒，游標因此明顯鈍。
//
// 改法：只改「元素」的 options 再呼叫 chart.render()（只重畫、不重算資料與比例尺）。
// A/B 實測 6.54 ms → 0.47 ms，快約 14 倍。順帶用 rAF 合併同一幀內的多次事件。
// （另外實測 getElementsAtEventForMode 只花 0.02 ms，偵測從來不是瓶頸 ——
//   憑直覺去優化偵測會完全白做工。）
let lastHoveredIdx = -1;
let pendingHoverIdx = -1;
let hoverRafId = 0;

function paintHighlight(chart, activeIdx) {
  const singleStore = chart.data.datasets.length === 1;
  chart.data.datasets.forEach((ds, i) => {
    const meta = chart.getDatasetMeta(i);
    const base = storeColor(ds.label);
    const isActive = i === activeIdx;
    const width = activeIdx === -1 ? 2 : (isActive ? 4.5 : 1);
    const radius = hoverPointRadius(isActive, activeIdx, singleStore);
    const color = (activeIdx !== -1 && !isActive) ? base + '40' : base;
    if (meta.dataset) {
      meta.dataset.options.borderWidth = width;
      meta.dataset.options.borderColor = color;
    }
    for (const pt of meta.data) pt.options.radius = radius;
  });
  chart.render();
}

function scheduleHighlight(chart, idx) {
  if (idx === lastHoveredIdx) return;
  pendingHoverIdx = idx;
  if (hoverRafId) return;                 // 同一幀內的後續事件併入這次
  hoverRafId = requestAnimationFrame(() => {
    hoverRafId = 0;
    if (pendingHoverIdx === lastHoveredIdx) return;
    lastHoveredIdx = pendingHoverIdx;
    paintHighlight(chart, pendingHoverIdx);
  });
}

const highlightPlugin = {
  id: 'legendHover',
  beforeEvent(chart, args) {
    const evt = args.event;
    if (evt.type === 'mouseout') { scheduleHighlight(chart, -1); return; }
    if (evt.type !== 'mousemove') return;

    // 偵測線條 hover
    const elements = chart.getElementsAtEventForMode(
      evt, 'dataset', { intersect: false }, false
    );
    let activeIdx = elements.length > 0 ? elements[0].datasetIndex : -1;

    // 偵測 legend hover
    const leg = chart.legend;
    if (leg && leg.legendHitBoxes) {
      for (let i = 0; i < leg.legendHitBoxes.length; i++) {
        const hb = leg.legendHitBoxes[i];
        if (evt.x >= hb.left && evt.x <= hb.left + hb.width &&
            evt.y >= hb.top  && evt.y <= hb.top + hb.height) {
          activeIdx = i;
          break;
        }
      }
    }

    scheduleHighlight(chart, activeIdx);
  }
};

const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'line',
  data: { datasets: [] },
  plugins: [highlightPlugin],
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { intersect: false, mode: 'nearest' },
    scales: {
      x: {
        type: 'time',
        time: {
          parser: 'yyyy-MM-dd HH:mm:ss',
          unit: 'minute',
          tooltipFormat: 'HH:mm',
          displayFormats: {
            second: 'HH:mm', minute: 'HH:mm', hour: 'HH:mm'
          }
        },
        title: { display: true, text: '時間', color: '#999' },
        ticks: {
          color: '#999',
          maxTicksLimit: 12,
          autoSkip: true,
          callback: function(value) {
            const d = new Date(value);
            return String(d.getHours()).padStart(2,'0') + ':' +
                   String(d.getMinutes()).padStart(2,'0');
          }
        },
        grid: { color: 'rgba(0,0,0,.05)' },
      },
      y: {
        beginAtZero: true,
        title: { display: true, text: '分鐘', color: '#999' },
        ticks: { color: '#999', stepSize: 5, precision: 0 },
        grid: { color: 'rgba(0,0,0,.05)' },
      }
    },
    plugins: {
      legend: {
        position: 'bottom',
        labels: { boxWidth: 12, padding: 14, font: { size: 12 } },
        // 點擊 legend = 單選那間店（再點一次 = 全部）
        onClick(evt, item, legend) {
          const name = item.text;
          if (selectedStore === name) {
            setFilter('__all__');
          } else {
            setFilter(name);
          }
        }
      },
      tooltip: {
        backgroundColor: 'rgba(60,30,10,0.9)',
        titleFont: { size: 12 }, bodyFont: { size: 13 },
        mode: 'nearest',
        intersect: false,
        callbacks: {
          title: function(items) {
            if (!items.length) return '';
            const raw = items[0].raw || items[0].element || {};
            const x = raw.x || items[0].label || '';
            return String(x).replace(/:\d{2}$/, '');
          },
          label: c => c.dataset.label + ': ' + c.parsed.y + ' 分鐘'
        }
      }
    }
  }
});

// ── 工具 ─────────────────────────────────────────
function createEl(tag, text, className) {
  const el = document.createElement(tag);
  if (text != null) el.textContent = text;
  if (className) el.className = className;
  return el;
}

// ── wait_time 的型別 ─────────────────────────────
// 官方 API 的 wait_time 不保證是數字，實測會回三種：
//   '125'            數字字串
//   '-1'             尚未營業
//   '已停止內用取號'  當日已停止取號（中文字串）
// 原本的程式只認得 '-1'，導致中文字串被當成數字處理：卡片出現
// 「已停止內用取號 分鐘」、表格出現「已停止內用取號分」、
// 圖表則直接把該事件丟掉、把最後一個數值一路延伸到現在（等於謊報）。
function waitNumber(wt) {
  if (wt === null || wt === undefined || wt === '' || wt === '-1') return null;
  const n = Number(wt);
  return Number.isFinite(n) ? n : null;
}

function waitLabel(wt) {
  if (wt === '-1') return '尚未營業';
  return wt;   // 例如「已停止內用取號」，原樣顯示，不加單位
}

function heatClass(wt) {
  const n = waitNumber(wt);
  if (n === null) return 'idle';
  if (n >= 40) return 'hot';
  if (n >= 15) return 'warm';
  return 'cool';
}

// ── 篩選控制 ─────────────────────────────────────
function setFilter(storeName) {
  selectedStore = storeName;
  document.getElementById('chartFilter').value = storeName;
  document.getElementById('tableFilter').value = storeName;
  // 更新卡片 selected 狀態
  document.querySelectorAll('.store-card').forEach(card => {
    const cn = card.dataset.store;
    card.classList.toggle('selected', storeName !== '__all__' && cn === storeName);
  });
  renderChart();
  renderTable();
}

function populateDropdowns(storeNames) {
  const chartSel = document.getElementById('chartFilter');
  const tableSel = document.getElementById('tableFilter');

  // 記住目前的值
  const curVal = selectedStore;

  // 清除舊選項（保留第一個「全部」）
  while (chartSel.options.length > 1) chartSel.remove(1);
  while (tableSel.options.length > 1) tableSel.remove(1);

  for (const name of storeNames) {
    chartSel.appendChild(new Option(name, name));
    tableSel.appendChild(new Option(name, name));
  }

  chartSel.value = curVal;
  tableSel.value = curVal;
}

document.getElementById('chartFilter').addEventListener('change', function() {
  setFilter(this.value);
});
document.getElementById('tableFilter').addEventListener('change', function() {
  setFilter(this.value);
});

// ── 分組工具 ─────────────────────────────────────
function groupByStore(rows) {
  const byStore = {};
  for (const r of rows) {
    const name = r.store_name;
    if (!byStore[name]) byStore[name] = [];
    byStore[name].push(r);
  }
  return byStore;
}

// 把 unix timestamp 格式化成台北時間 HH:MM（不是訪客的當地時間）
function fmtStopTime(unixTs) {
  if (!unixTs || unixTs === 0) return null;
  return taipeiClock(new Date(unixTs * 1000 + 8 * 3600 * 1000));
}

// 依停止取號時間判斷熱度（越早 = 越熱），同樣以台北時間為準
function stopTimeHeat(unixTs) {
  if (!unixTs) return 'unset';
  const d = new Date(unixTs * 1000 + 8 * 3600 * 1000);
  const h = d.getUTCHours() + d.getUTCMinutes() / 60;
  if (h < 18.5) return 'hot';
  if (h < 19.0) return 'warm';
  return '';
}

// 卡片 hover → 對應的線加粗、其餘變淡。
// 與圖表內 hover 走同一條 scheduleHighlight()，所以兩種進入方式的視覺一致，
// 也共用 rAF 合併與「只改元素樣式 + render()」的低成本重繪路徑。
function hoverStoreFromCard(name) {
  if (!chart) return;
  const idx = name === null
    ? -1
    : chart.data.datasets.findIndex(ds => ds.label === name);
  scheduleHighlight(chart, idx);
}

function attachCardHover(card, name) {
  card.addEventListener('mouseenter', () => hoverStoreFromCard(name));
  card.addEventListener('mouseleave', () => hoverStoreFromCard(null));
}

// ── 渲染：卡片（用 /api/latest 給每店「現在」的值）───
// 以 allStores（來自 /api/stores 的權威清單）為基準逐店渲染，而不是只跑
// latestList。原因：某店若連續抓取失敗超過查詢視窗，它會從 /api/latest 消失，
// 卡片就無聲不見了 —— 使用者只會看到 10 張卡片而不會察覺少了一家。
// 現在改成一律出現，抓不到就明確標示「資料中斷」。
function renderCards(latestList) {
  const overview = document.getElementById('overview');
  overview.replaceChildren();

  const byName = new Map(latestList.map(r => [r.store_name, r]));
  const roster = allStores.length ? allStores : latestList.map(r => r.store_name);

  // 桌機版靠這個變數把 grid 欄數釘成分店數，確保排成一列。
  // 用實際數量而非寫死 11，將來增減分店不必改 CSS。
  overview.style.setProperty('--store-count', String(roster.length));

  for (const name of roster) {
    const r = byName.get(name);
    if (!r) {
      const card = document.createElement('div');
      card.className = 'store-card idle';
      card.dataset.store = name;
      card.addEventListener('click', () => setFilter(selectedStore === name ? '__all__' : name));
      attachCardHover(card, name);
      card.appendChild(createEl('div', name, 'name'));
      const wrap = createEl('div', null, 'closed');
      wrap.appendChild(createEl('span', '資料中斷', 'wait'));
      card.appendChild(wrap);
      card.appendChild(createEl('div', '近期無成功抓取', 'stop-time unset'));
      overview.appendChild(card);
      continue;
    }
    const wt = r.wait_time;
    const wn = waitNumber(wt);
    const isClosed = wn === null;   // '-1' 與「已停止內用取號」都算

    const card = document.createElement('div');
    card.className = 'store-card ' + heatClass(wt);
    if (selectedStore !== '__all__' && selectedStore === name) {
      card.classList.add('selected');
    }
    card.dataset.store = name;

    card.addEventListener('click', () => {
      setFilter(selectedStore === name ? '__all__' : name);
    });
    attachCardHover(card, name);

    card.appendChild(createEl('div', name, 'name'));
    if (isClosed) {
      // 非數值狀態不加「分鐘」單位，否則會出現「已停止內用取號 分鐘」
      const wrap = createEl('div', null, 'closed');
      wrap.appendChild(createEl('span', waitLabel(wt), 'wait'));
      card.appendChild(wrap);
    } else {
      card.appendChild(createEl('span', String(wn), 'wait'));
      card.appendChild(createEl('span', ' 分鐘', 'unit'));
    }

    // 預計停止取號時間
    const stopStr = fmtStopTime(r.last_time);
    const stopDiv = document.createElement('div');
    const heat = stopTimeHeat(r.last_time);
    stopDiv.className = 'stop-time ' + heat;
    if (stopStr) {
      stopDiv.appendChild(createEl('span', '止號 ', 'label'));
      stopDiv.appendChild(createEl('span', stopStr));
    } else {
      stopDiv.textContent = '止號 尚未設定';
    }
    card.appendChild(stopDiv);

    overview.appendChild(card);
  }
}

// ── 上游 API 的瞬間 0 值毛刺 ──────────────────────
// 官方端點偶爾會在單一取樣回報 0，下一分鐘又跳回原本的值。
// 實測 2026-05-17 一天 12 次，最決定性的一筆是：
//   高雄店 20:58  已停止內用取號 → 0 → 已停止內用取號（0 只持續 1 分鐘）
// 一家「已停止取號」的店不可能真的變成「等候 0 分鐘」再變回停止；
// 同理，等候 120 分鐘的隊伍也不可能在 60 秒內清空又回到 120 分鐘。
//
// 判定條件（刻意收窄，寧可漏抓也不要誤殺真實紀錄）：
//   1. 這個值只持續 ≤1 分鐘（看下一個事件的 duration_min）
//   2. 且符合下列其一：
//      a) 前後鄰居都是有效數值，而這個值同時滿足
//           ‧ 掉到兩者較小者的一半以下（相對）
//           ‧ 絕對落差 ≥30 分鐘
//      b) 前後鄰居是相同的非數值狀態（例如「已停止內用取號」），而這個值是 0
//
// 為什麼不只看「等於 0」：實測 5 天 19 筆瞬間深谷，17 筆是 0、2 筆不是
// （南西店 110 → 10 → 120、台中店 130 → 95 → 130），同一個物理不可能。
//
// 為什麼相對條件不夠、一定要加絕對門檻：只用「掉一半」時，跨 3 天實測發現它在
// 低數值區大量誤殺 —— 5 → 0 → 5、8 → 0 → 8、10 → 0 → 10 全被判為毛刺。
// 但 5 分鐘的隊伍排空一分鐘、再來一組客人，是每天都在發生的正常現象。
// 官方以 5 分鐘為級距更新，一分鐘內掉 30 分鐘等於連跌 6 級再連漲 6 級，
// 那才是物理上不可能的量級。
//
// 刻意不抓的例子（都經實測確認是真實紀錄）：
//   天母店 5 → 0 → 5      短隊真的排空（且 0 持續 13 分鐘）
//   新生店 -1 → 0 → 35    '-1' 是「尚未營業」，這是開店瞬間（開了還沒人 → 一次領號）
//   台中店 130 → 95 → 130 只掉 27%，未過半
//   板橋店 10 → 0 → 8     落差僅 8 分鐘，低於絕對門檻
//
// 只影響「圖表怎麼畫」。原始資料完全不動，變化事件表格照常列出並標示，
// 因為那是稽核紀錄 —— 隱藏紀錄跟畫出不存在的線一樣不可接受。
const GLITCH_MAX_MIN = 1;      // 這個值只持續幾分鐘才算「瞬間」
const GLITCH_DROP_RATIO = 0.5; // 相對條件：掉到鄰居較小者的幾成以下
const GLITCH_MIN_DROP = 30;    // 絕對條件：落差至少幾分鐘（防止低數值區誤殺）
let glitchSet = new Set();

function findGlitches(rows) {
  const byStore = {};
  for (const r of rows) {
    if (!byStore[r.store_id]) byStore[r.store_id] = [];
    byStore[r.store_id].push(r);
  }
  const found = new Set();
  for (const evs of Object.values(byStore)) {
    for (let i = 0; i < evs.length; i++) {
      const e = evs[i];
      const nxt = evs[i + 1];
      if (!nxt) continue;                                   // 當日最後一筆，無從判斷
      const held = nxt.duration_min;
      if (held === null || held === undefined || held > GLITCH_MAX_MIN) continue;

      const cur = waitNumber(e.wait_time);
      if (cur === null) continue;                           // 非數值狀態本身不算毛刺
      const prev = waitNumber(e.prev_value);
      const next = waitNumber(nxt.wait_time);

      if (prev !== null && next !== null) {
        // (a) 前後都是有效數值 → 相對與絕對兩個條件都要成立
        const floor = Math.min(prev, next);
        if (cur <= floor * GLITCH_DROP_RATIO && floor - cur >= GLITCH_MIN_DROP) found.add(e);
      } else if (e.prev_value !== null && e.prev_value === nxt.wait_time && cur === 0) {
        // (b) 前後是同一個非數值狀態（已停止內用取號 → 0 → 已停止內用取號）
        found.add(e);
      }
    }
  }
  return found;
}

// ── 把 changes 轉成 chart datasets（step line）───
// 邏輯：每個 change event 是一個 (timestamp, wait_time)。
// Chart.js 用 stepped:'before' → 線條會在 timestamp 時刻「跳」到新值。
// 最後一段值要延伸到「現在」，但**只在該店仍在取號時**才延伸。
//
// 舊版把非數值事件（'-1'、「已停止內用取號」）整個 continue 掉，
// 結果延伸邏輯拿最後一個數值一路畫到現在 —— 南西店 18:50 就停止取號，
// 圖表卻宣稱它到 20:05 都還是 125 分鐘。那是謊報，不是缺漏。
// 正確做法：非數值事件不畫成點，但要記下「線在此刻終止」。
function buildChartDatasets(changes, dateStr) {
  const byStore = {};
  const stoppedAt = {};   // store_name → 停止取號的時間戳
  for (const r of changes) {
    if (glitchSet.has(r)) continue;   // 上游瞬間 0 值毛刺，不畫（資料仍保留）
    const n = waitNumber(r.wait_time);
    if (n === null) {
      // 非數值 = 該店此刻起不再有有效候位時間，線到此為止
      if (byStore[r.store_name]) stoppedAt[r.store_name] = r.timestamp;
      continue;
    }
    // 若之前停過又恢復報數（跨營業時段），清掉終止標記
    delete stoppedAt[r.store_name];
    if (!byStore[r.store_name]) byStore[r.store_name] = [];
    byStore[r.store_name].push({ x: r.timestamp, y: n });
  }

  // 延伸線到當日最末（看歷史 = 當日 23:59:59；看今日 = 當下時間）
  // 延伸到「台北的現在」，不是訪客當地的現在
  const isToday = dateStr === todayStr();
  const t = taipeiNow();
  const tailStr = isToday
    ? dateStr + ' ' +
      String(t.getUTCHours()).padStart(2,'0') + ':' +
      String(t.getUTCMinutes()).padStart(2,'0') + ':' +
      String(t.getUTCSeconds()).padStart(2,'0')
    : dateStr + ' 23:59:59';

  const showStores = selectedStore === '__all__'
    ? Object.keys(byStore)
    : (byStore[selectedStore] ? [selectedStore] : []);

  const datasets = [];
  for (const name of showStores) {
    const pts = byStore[name].slice();
    // 補延伸點。兩個上限，缺一不可：
    //   (a) 已停止取號 → 只延到停止的那一刻
    //   (b) 抓取失敗   → 只延到最後一次真的抓到這家店的時刻
    // 兩者是同一類錯誤的不同觸發路徑：延伸邏輯把「沒有新的變化事件」
    // 當成「值沒變」，但它也可能是「我們根本沒抓到資料」。少了 (b)，
    // 一家連續抓不到的店會被畫成一條自信的水平線 —— 那是謊報。
    // 決定線條要畫到哪裡。三種情況要分清楚，混在一起就會失真：
    //   1. 觀測到停止取號 → 延到那一刻（這是我們「真的看到」的事實，要保留）
    //   2. 歷史日         → 延到當日終點
    //   3. 今日仍在營業   → 延到「最後一次真的抓到這家店」與「現在」的較早者；
    //                       若完全沒有近期觀測（連續抓取失敗），就不延伸
    if (pts.length > 0) {
      let end;
      if (stoppedAt[name]) {
        end = stoppedAt[name];
      } else if (!isToday) {
        end = tailStr;
      } else {
        const seen = lastSeenByStore[name];
        end = seen ? (seen < tailStr ? seen : tailStr) : null;
      }
      if (end) pts.push({ x: end, y: pts[pts.length - 1].y });
    }
    const color = storeColor(name);
    const single = showStores.length === 1;
    datasets.push({
      label: name,
      data: pts,
      borderColor: color,
      backgroundColor: color + '20',
      borderWidth: 2,
      // 全部分店時不畫點。整天的資料是 11 條線、600 多個變化事件 ——
      // 每個事件都畫一個圓點會蓋掉線條本身，看不出趨勢（實測 2026-05-17
      // 這天 626 個點）。步階線的轉折本來就標示了變化時刻，點是多餘的。
      // 篩選單店時才畫點，因為那時每個點都看得清楚、也才有意義。
      pointRadius: single ? 3 : 0,
      // 點雖然不畫，滑到附近仍會浮出來，tooltip 的定位也不受影響
      pointHoverRadius: single ? 5 : 4,
      pointBackgroundColor: color,
      stepped: 'before',  // 步階線：橫線維持到下個變化點才跳
      fill: single,
    });
  }
  return datasets;
}

// hover 高亮時，被指到的那條線把點顯示出來，其餘維持不畫。
// 沒有這個的話，多分店檢視下高亮只能靠線條粗細與顏色深淺區分，
// 線一多就不夠明顯。
function hoverPointRadius(isActive, activeIdx, singleStore) {
  if (activeIdx === -1) return singleStore ? 3 : 0;   // 無 hover：回到預設
  return isActive ? 4 : 0;
}

// 由分鐘數產生 'HH:MM:SS'，讓軸範圍與抓取視窗共用同一組常數，不會各改各的
function minToClock(m) {
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' +
         String(m % 60).padStart(2, '0') + ':00';
}

// 時間軸範圍。
// 兩個原則：
//   1. 用「當日全部分店」的資料計算，不用篩選後的子集 —— 否則點某一家店，
//      時間軸會縮成那家店自己的範圍（例如只到 19:30），跟全部分店的視圖對不起來。
//   2. 下限固定為抓取視窗 09:00–21:30，即使當天資料還沒填滿也一樣，
//      這樣每天的圖橫向尺度一致、可以直接比較。
//      但真實資料若超出這個範圍（例如本機 24 小時收集的歷史日），以資料為準 ——
//      為了「好看」把真的存在的紀錄裁掉，就是拿呈現去騙資料。
function applyAxisRange() {
  let min = `${selectedDate} ${minToClock(FETCH_WINDOW_START_MIN)}`;
  let max = `${selectedDate} ${minToClock(FETCH_WINDOW_END_MIN)}`;
  for (const r of allRows) {
    if (r.timestamp < min) min = r.timestamp;
    if (r.timestamp > max) max = r.timestamp;
  }
  chart.options.scales.x.min = min;
  chart.options.scales.x.max = max;
}

function renderChart() {
  // 取消還沒執行的 hover 重繪。它帶的是「改版前」的 dataset 索引：
  // 點卡片會同時觸發 mouseenter（記下該店在 11 條線中的索引）與 click（篩成 1 條線），
  // 等 rAF 執行時舊索引已不存在，唯一那條線會被判定為「非高亮」而整條淡化、不顯示點。
  // 非同步排程的典型陷阱 —— 排程當下的世界跟執行當下的世界不是同一個。
  if (hoverRafId) { cancelAnimationFrame(hoverRafId); hoverRafId = 0; }
  pendingHoverIdx = -1;

  chart.data.datasets = buildChartDatasets(allRows, selectedDate);
  applyAxisRange();
  chart.update('none');
  // update() 會依 dataset 設定重新解析元素樣式，等於把 hover 高亮沖掉。
  // 歸零記錄，讓下一次滑鼠移動重新套用，否則會卡在「以為還在高亮」的狀態。
  lastHoveredIdx = -1;
}

// ── 渲染：表格（transition log）─────────────────
const MAX_TABLE_ROWS = 500;

function fmtDuration(min) {
  if (min === null || min === undefined) return '—';
  if (min < 60) return `${min} 分`;
  const h = Math.floor(min / 60), m = min % 60;
  return m === 0 ? `${h} 小時` : `${h}小時${m}分`;
}

function fmtChange(prev, next) {
  // 非數值狀態原樣顯示，不加「分」單位（否則會出現「已停止內用取號分」）
  const fmtVal = (v) => {
    const n = waitNumber(v);
    return n === null ? waitLabel(v) : `${n}分`;
  };
  if (prev === null || prev === undefined) return fmtVal(next);  // 起點
  return `${fmtVal(prev)} → ${fmtVal(next)}`;
}

function renderTable() {
  const filtered = selectedStore === '__all__'
    ? allRows
    : allRows.filter(r => r.store_name === selectedStore);

  const totalCount = filtered.length;
  const showRows = totalCount > MAX_TABLE_ROWS
    ? filtered.slice(-MAX_TABLE_ROWS)
    : filtered;

  const frag = document.createDocumentFragment();
  for (let i = showRows.length - 1; i >= 0; i--) {
    const r = showRows[i];
    const tr = document.createElement('tr');

    // 時間（含秒）
    tr.appendChild(createEl('td', r.timestamp));
    tr.appendChild(createEl('td', r.store_name));

    // 變化欄：轉入非數值狀態（未營業／已停止取號）用淡色標示
    const isClosing = waitNumber(r.wait_time) === null;
    const cls = isClosing ? 'td-closed' : 'td-wait';
    const td = createEl('td', fmtChange(r.prev_value, r.wait_time), cls);
    // 毛刺照常列出，只加標記。表格是稽核紀錄 —— 隱藏它跟畫出不存在的線一樣不可接受。
    if (glitchSet.has(r)) {
      tr.classList.add('glitch-row');
      td.title = '疑似上游 API 瞬間錯誤回報：此值只持續 1 分鐘且掉超過一半後即彈回。圖表不繪製此點，資料仍完整保留。';
      td.appendChild(createEl('span', ' ※', 'glitch-mark'));
    }
    tr.appendChild(td);

    tr.appendChild(createEl('td', fmtDuration(r.duration_min)));
    frag.appendChild(tr);
  }

  document.getElementById('tableBody').replaceChildren(frag);

  document.getElementById('totalRows').textContent =
    totalCount > MAX_TABLE_ROWS
      ? `${totalCount} 個變化（顯示最新 ${MAX_TABLE_ROWS}）`
      : `${totalCount} 個變化`;
}

// 「上次更新」要顯示**資料的**時間，不是瀏覽器的時鐘。
// 抓取只跑台北 09:00-21:30，非抓取時段看板顯示的是當天最後一筆；
// 若寫成當下時間，等於宣稱資料是剛抓的 —— 那是謊報。
// 抓取視窗（台北時間），必須與 worker/wrangler.toml 的 cron 一致：
//   "* 1-12 * * *" + "0-30 13 * * *"（UTC）= 台北 09:00–21:30
// 用「分鐘數」而非整點，因為結束時間是 21:30 不是整點。
const FETCH_WINDOW_START_MIN = 9 * 60;         // 09:00
const FETCH_WINDOW_END_MIN = 21 * 60 + 30;     // 21:30

function renderFreshness(latestList) {
  const el = document.getElementById('lastUpdate');
  if (!latestList.length) { el.textContent = '無資料'; return; }
  const ts = latestList.map(r => r.timestamp).sort().pop();
  const ageMin = Math.floor(
    (taipeiNow().getTime() - Date.parse(ts.replace(' ', 'T') + 'Z')) / 60000
  );

  // 「非抓取時段」必須依**當下是否真的在視窗外**判斷，不能用「超過 1 小時」推測。
  // 舊寫法會把下午的斷線標成「非抓取時段」，等於安慰使用者說這是正常排程休息 ——
  // 那是在製造假的安心感，比不顯示還糟。
  const n = taipeiNow();
  const mins = n.getUTCHours() * 60 + n.getUTCMinutes();
  const outsideWindow = mins < FETCH_WINDOW_START_MIN || mins > FETCH_WINDOW_END_MIN;

  let suffix = '';
  if (ageMin >= 5) {
    const age = ageMin >= 60 ? `${Math.floor(ageMin / 60)} 小時前` : `${ageMin} 分鐘前`;
    suffix = outsideWindow ? `（${age}，非抓取時段）` : `（${age}，資料可能中斷）`;
  } else if (ageMin >= 3) {
    suffix = `（${ageMin} 分鐘前）`;
  }
  el.textContent = ts.slice(11, 16) + ' 台北 ' + suffix;
}

// ── 主渲染 ──────────────────────────────────────
function render(changesRows, latestList) {
  allRows = changesRows;
  glitchSet = findGlitches(allRows);
  // 下拉用 /api/stores 的權威清單；抓不到的店也要留在選單裡，否則使用者
  // 會以為那家店不存在，而不是「那家店現在抓不到」。
  const newStores = allStores.length ? allStores : latestList.map(r => r.store_name);
  if (newStores.join() !== knownStores.join()) {
    knownStores = newStores;
    populateDropdowns(knownStores);
  }
  // 記錄每店最後一次成功抓取的時間，給圖表當延伸上限
  lastSeenByStore = Object.fromEntries(latestList.map(r => [r.store_name, r.timestamp]));

  renderCards(latestList);
  renderChart();
  renderTable();
  renderFreshness(latestList);
}

// 明確的錯誤狀態。沒有這個的話，端點掛掉時畫面是「空的但看起來正常」——
// 使用者會以為今天沒人排隊，而不是知道這裡出錯了。
function renderError(msg) {
  const overview = document.getElementById('overview');
  const box = createEl('div', null, 'store-card idle');
  box.style.gridColumn = '1 / -1';
  box.appendChild(createEl('div', '無法取得資料', 'name'));
  box.appendChild(createEl('div', msg, 'stop-time unset'));
  overview.replaceChildren(box);
  document.getElementById('lastUpdate').textContent = '連線失敗';
}

// ── 定時拉資料 ──────────────────────────────────
// Codex 2026-05-08 10:22 +08:00：前端輪詢加上 in-flight guard 與逾時取消，避免斷線時堆積未完成 fetch。
const FETCH_TIMEOUT_MS = 10000;
let refreshInFlight = false;
let refreshController = null;

async function fetchJson(url, signal) {
  const resp = await fetch(url, { signal });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

// 歷史日優先讀本 repo 的靜態檔（不消耗 Worker 額度、且 CDN 快取友善）；
// 沒有靜態檔才回頭問 Worker。今日一律走 Worker，因為資料還在長。
async function fetchChanges(date, signal) {
  if (date !== todayStr() && archiveDates.has(date)) {
    try {
      return await fetchJson(`${ARCHIVE_BASE}/${date}.json`, signal);
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      console.warn('archive miss, fallback to API:', date, e.message);
    }
  }
  return fetchJson(`${API_BASE}/api/changes?date=${encodeURIComponent(date)}`, signal);
}

async function refresh(options = {}) {
  if (refreshInFlight) {
    if (!options.force) return;
    if (refreshController) refreshController.abort();
  }

  refreshInFlight = true;
  const requestDate = selectedDate;
  const controller = new AbortController();
  refreshController = controller;
  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

  try {
    // 用 allSettled 而非 all：Promise.all 任一個 reject 就整包放棄，
    // 成功的那半也被丟掉 —— 一個端點掛掉會讓整頁空白。
    // 現在改成能畫多少畫多少，兩個都失敗才顯示錯誤狀態。
    const [chRes, ltRes] = await Promise.allSettled([
      fetchChanges(requestDate, controller.signal),
      fetchJson(`${API_BASE}/api/latest`, controller.signal),
    ]);
    if (chRes.status === 'rejected' && chRes.reason?.name === 'AbortError') return;
    if (ltRes.status === 'rejected' && ltRes.reason?.name === 'AbortError') return;

    if (chRes.status === 'rejected' && ltRes.status === 'rejected') {
      console.error('fetch error:', chRes.reason, ltRes.reason);
      renderError(`${chRes.reason?.message ?? chRes.reason}`);
      return;
    }
    if (chRes.status === 'rejected') console.error('changes fetch failed:', chRes.reason);
    if (ltRes.status === 'rejected') console.error('latest fetch failed:', ltRes.reason);

    if (selectedDate === requestDate) {
      render(
        chRes.status === 'fulfilled' ? chRes.value : allRows,
        ltRes.status === 'fulfilled' ? ltRes.value : [],
      );
    }
  } catch (e) {
    if (e.name !== 'AbortError') console.error('fetch error:', e);
  } finally {
    clearTimeout(timeoutId);
    if (refreshController === controller) {
      refreshInFlight = false;
      refreshController = null;
    }
  }
}

let autoRefreshTimer = null;
function setupAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = null;   // 清掉後把變數也歸零，否則狀態看起來像還在跑
  // 只在「今日」才自動刷新（歷史日資料不會變，省 CPU）
  // 60 秒而非原本的 15 秒：後端 cron 本來就每 60 秒才寫一次，
  // 15 秒輪詢有 3/4 是重複請求，白白吃掉與 MusicalMap 共用的帳號額度。
  if (selectedDate === todayStr()) {
    autoRefreshTimer = setInterval(refresh, 60000);
  }
}

// ── 日曆式日期選擇 ──────────────────────────────
// 「有無資料」的呈現刻意做兩層：顏色（實心淡底 vs 灰）＋ 能不能點。
// 只靠顏色的話，色弱使用者與縮圖狀態下分不出來；把它綁到互動能力上，
// 就算完全看不出顏色差異，點下去沒反應也立刻知道那天沒有資料。
let availableDates = new Set();
let calMonth = todayStr().slice(0, 7);   // 目前顯示的月份 YYYY-MM

const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
// 一律用 UTC 數學。new Date(y, m, d) 會走瀏覽器時區，
// 對非台灣訪客會讓整個月份的格子錯開一天。
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const firstDow = (y, m) => new Date(Date.UTC(y, m - 1, 1)).getUTCDay();

function renderDateButton() {
  document.getElementById('dateBtn').textContent = dateLabel(selectedDate);
}

function renderMonthOptions() {
  const counts = {};
  for (const d of availableDates) {
    const m = d.slice(0, 7);
    counts[m] = (counts[m] || 0) + 1;
  }
  const months = new Set(Object.keys(counts));
  months.add(calMonth);                       // 目前翻到的月份就算沒資料也要在選單裡
  const list = [...months].sort().reverse();
  const sel = document.getElementById('calMonthSel');
  sel.replaceChildren();
  for (const m of list) {
    const [y, mm] = m.split('-');
    const n = counts[m] || 0;
    sel.appendChild(new Option(`${y} 年 ${Number(mm)} 月${n ? `（${n} 天）` : '（無）'}`, m));
  }
  sel.value = calMonth;
}

function renderCalendar() {
  renderMonthOptions();
  const [y, m] = calMonth.split('-').map(Number);
  const today = todayStr();
  const frag = document.createDocumentFragment();

  for (let i = 0; i < firstDow(y, m); i++) {
    frag.appendChild(createEl('div', '', 'cal-day empty'));
  }
  for (let d = 1; d <= daysInMonth(y, m); d++) {
    const iso = ymd(y, m, d);
    const has = availableDates.has(iso);
    const isToday = iso === today;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = String(d);
    btn.className = 'cal-day ' + (has ? 'has' : 'none')
      + (isToday ? ' today' : '') + (iso === selectedDate ? ' sel' : '');
    // 今日一律可點（就算資料還沒開始累積，也要能切過去看目前狀態）
    if (has || isToday) {
      btn.title = dateLabel(iso) + (has ? '' : '（今日，資料尚未開始累積）');
      btn.addEventListener('click', () => pickDate(iso));
    } else {
      btn.disabled = true;
      btn.title = `${iso}　無資料`;
    }
    frag.appendChild(btn);
  }
  document.getElementById('calGrid').replaceChildren(frag);
}

function pickDate(iso) {
  selectedDate = iso;
  closeCalendar();
  renderDateButton();
  refresh({ force: true });   // 保留分店篩選（切昨日 → 依然是同一家店的昨日資料）
  setupAutoRefresh();         // 切歷史日就停 timer，切回今日就恢復
}

function openCalendar() {
  calMonth = selectedDate.slice(0, 7);   // 每次打開都跳到目前選定日期的月份
  renderCalendar();
  document.getElementById('calPopup').hidden = false;
  document.getElementById('dateBtn').setAttribute('aria-expanded', 'true');
}

function closeCalendar() {
  document.getElementById('calPopup').hidden = true;
  document.getElementById('dateBtn').setAttribute('aria-expanded', 'false');
}

function shiftMonth(delta) {
  const [y, m] = calMonth.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  calMonth = `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}`;
  renderCalendar();
}

document.getElementById('dateBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (document.getElementById('calPopup').hidden) openCalendar();
  else closeCalendar();
});
document.getElementById('calPrev').addEventListener('click', () => shiftMonth(-1));
document.getElementById('calNext').addEventListener('click', () => shiftMonth(1));
document.getElementById('calMonthSel').addEventListener('change', function () {
  calMonth = this.value;
  renderCalendar();
});
document.addEventListener('click', (e) => {
  if (!document.querySelector('.cal-wrap').contains(e.target)) closeCalendar();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCalendar();
});

async function populateDateDropdown() {
  try {
    // 兩個來源合併：repo 靜態歷史檔 + Worker（今日與尚未匯出的日子）
    // 失敗要留下痕跡：原本靜默 `.catch(() => [])`，`/api/dates` 掛掉時
    // 歷史日期會整批消失，畫面看起來像「這站只有今天的資料」。
    const [archive, live] = await Promise.all([
      fetchJson(`${ARCHIVE_BASE}/index.json`)
        .catch(e => { console.warn('archive index 讀取失敗，歷史日期可能不完整:', e.message); return []; }),
      fetchJson(`${API_BASE}/api/dates`)
        .catch(e => { console.warn('/api/dates 讀取失敗，歷史日期可能不完整:', e.message); return []; }),
    ]);
    archiveDates = new Set(archive);
    // 只放「真的有資料」的日期。今日不硬塞 —— 它是否有資料由實際結果決定，
    // 硬塞會讓日曆宣稱今天有資料，那又是一種謊報。今日仍可點，見 renderCalendar()。
    availableDates = new Set([...archive, ...live]);
    renderDateButton();
    if (!document.getElementById('calPopup').hidden) renderCalendar();
  } catch (e) {
    console.error('dates fetch error:', e);
  }
}

(async () => {
  // 先取得權威分店清單。有了它，即使某店抓取失敗、從 /api/latest 消失，
  // 卡片與下拉選單仍會出現並標示「資料中斷」，而不是無聲少一家。
  try {
    allStores = (await fetchJson(`${API_BASE}/api/stores`)).map(s => s.store_name);
  } catch (e) {
    console.warn('/api/stores 讀取失敗，改用 latest 的店家清單:', e.message);
  }
  await populateDateDropdown();
  refresh();
  setupAutoRefresh();
  // 每 10 分鐘重新掃日期清單（跨午夜後能自動出現新的今日選項）
  setInterval(populateDateDropdown, 600000);
})();
</script>

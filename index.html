<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼎泰豐全分店 — 候位監控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f5f0eb;
    color: #3a3a3a;
    padding: 20px 24px;
  }

  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 24px; color: #8b4513; letter-spacing: 2px; }
  header .update-note {
    font-size: 12px; color: #6f6558;
    padding-left: 10px; border-left: 1px solid #d9cdbb;
  }
  header .date-picker {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 10px; font-size: 13px; color: #5a3a1a;
  }
  header .date-picker select {
    font-family: inherit; font-size: 13px;
    padding: 4px 10px; border: 1px solid #d4c3aa;
    border-radius: 6px; background: #fff; color: #3a3a3a;
    cursor: pointer; min-width: 140px;
  }
  header .date-picker select:focus { outline: 2px solid #8b4513; }

  /* 即時總覽卡片 */
  .overview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .store-card {
    background: #fff;
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
    transition: transform .15s;
    cursor: pointer;
  }
  .store-card:hover { transform: translateY(-2px); }
  .store-card .name {
    font-size: 13px; font-weight: 600;
    color: #5a3a1a; margin-bottom: 6px;
  }
  /* 候位分鐘數是卡片上最重要的資訊，改為暖調近黑使其成為最深的元素
     （原本主題棕比店名還淺，視覺層級是反的）。詳見 docs/index.html。 */
  .store-card .wait { font-size: 28px; font-weight: 700; color: #2b2118; }
  .store-card .unit { font-size: 11px; color: #b08860; }
  /* 原為 #bbb，對比僅 1.9 且是純灰；改用暖調柔和棕灰（對比 5.3）。 */
  .store-card .closed .wait { font-size: 14px; color: #6f6558; }
  .store-card .stop-time {
    margin-top: 6px;
    font-size: 11px;
    color: #b08860;
    line-height: 1.3;
  }
  .store-card .stop-time .label { color: #999; }
  .store-card .stop-time.hot { color: #d32f2f; font-weight: 600; }
  .store-card .stop-time.warm { color: #f57c00; }
  .store-card .stop-time.unset { color: #ccc; font-style: italic; }
  /* 左側色帶＝這家分店在圖表裡的線條顏色（由 JS 依 STORE_COLORS 寫入）。
     原本用紅／橘／綠表示等候時間長短，與圖表「顏色代表哪家分店」互相衝突。 */
  .store-card { border-left: 4px solid transparent; }
  .store-card.selected { outline: 3px solid #8b4513; outline-offset: -3px; }

  /* 圖表 */
  .chart-wrap {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
    margin-bottom: 24px;
  }
  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .chart-header h2 { font-size: 15px; color: #8b4513; white-space: nowrap; }

  /* 圖表圖例（原本由 Chart.js 畫在 canvas 底部，會吃掉繪圖區的高度）。
     搬到標題這一排之後，那些高度全部還給繪圖區。
     flex: 1 讓它吃掉標題與篩選器之間的空間，窄畫面再自行換行。 */
  .chart-legend {
    flex: 1 1 auto;
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center;
    gap: 4px 12px;
  }
  .chart-legend .lg-item {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: inherit; font-size: 12px; color: #5a3a1a;
    background: none; border: 0; padding: 3px 2px;
    cursor: pointer; line-height: 1.2;
    /* 觸控目標高度：WCAG 2.2 AA 要求 24px */
    min-height: 24px;
  }
  .chart-legend .lg-item i {
    width: 11px; height: 11px; border-radius: 2px;
    border: 1.5px solid currentColor; background: transparent;
    flex: none;
  }
  .chart-legend .lg-item:hover { color: #8b4513; }
  .chart-legend .lg-item:focus-visible {
    outline: 2px solid #8b4513; outline-offset: 1px; border-radius: 3px;
  }
  /* 被選為單一檢視的那一項 */
  .chart-legend .lg-item[aria-pressed="true"] { font-weight: 700; color: #8b4513; }

  .chart-filter {
    display: flex; align-items: center; gap: 8px;
  }
  .chart-filter label { font-size: 12px; color: #999; }
  .chart-filter select {
    font-family: inherit; font-size: 13px;
    padding: 4px 10px; border: 1px solid #ddd;
    border-radius: 6px; background: #fff; color: #3a3a3a;
    cursor: pointer;
  }
  .chart-filter select:focus { outline: 2px solid #8b4513; }
  .chart-container { position: relative; width: 100%; height: 350px; }

  /* 表格 */
  .table-wrap {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
  }
  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .table-header h2 { font-size: 15px; color: #8b4513; }
  .table-header select {
    font-family: inherit; font-size: 13px;
    padding: 4px 10px; border: 1px solid #ddd;
    border-radius: 6px; background: #fff; color: #3a3a3a;
    cursor: pointer;
  }
  .table-header select:focus { outline: 2px solid #8b4513; }
  .scroll-box { max-height: 450px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    background: #8b4513; color: #fff;
    padding: 8px 10px; text-align: center;
    font-weight: 500; position: sticky; top: 0;
  }
  tbody tr:nth-child(even) { background: #faf6f1; }
  tbody tr:hover { background: #f0e6d8; }
  tbody td {
    padding: 6px 10px; text-align: center;
    border-bottom: 1px solid #eee; white-space: nowrap;
  }
  .td-wait { font-weight: 700; color: #8b4513; }
  /* 與卡片的 .closed .wait 同步（原 #bbb 對比僅 1.9）。 */
  .td-closed { color: #6f6558; font-style: italic; }

  /* 疑似上游瞬間毛刺：照常列出（表格是稽核紀錄），只是淡化並加註記 */
  tbody tr.glitch-row { opacity: .55; }
  tbody tr.glitch-row td { text-decoration: line-through; text-decoration-color: #c9b8a0; }
  .glitch-mark { font-weight: 400; color: #b08860; text-decoration: none; cursor: help; }

  .refresh-info {
    text-align: center; font-size: 11px; color: #bbb; margin-top: 14px;
  }

  .site-footer {
    max-width: 760px;
    margin: 36px auto 8px;
    padding: 18px 22px;
    font-size: 12px;
    color: #8a7a66;
    line-height: 1.75;
    text-align: center;
    border-top: 1px solid #e4d9c9;
  }
  .site-footer a {
    color: #8b4513;
    text-decoration: none;
    border-bottom: 1px dotted #b08860;
  }
  .site-footer a:hover { border-bottom-style: solid; }
  .site-footer .row { margin: 2px 0; }
  .site-footer .license {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    border: 1px solid #d4c3aa;
    border-radius: 4px;
    font-size: 11px;
  }

  /* ── 桌機：全部分店強制排成一列 ──────────────────
     原本 repeat(auto-fill, minmax(130px, 1fr)) 只保證「塞得下幾欄就排幾欄」，
     1600px 剛好 11 欄、1440px 只有 9 欄就換行。改成明確指定欄數。
     字級用容器單位 cqw 而非 vw：卡片寬度會隨視窗一起縮，用 vw 比例固定，
     永遠差零點幾 px 而讓「已停止內用取號」擠成兩行。 */
  @media (min-width: 1160px) {
    .overview {
      grid-template-columns: repeat(var(--store-count, 11), minmax(0, 1fr));
      gap: 8px;
    }
    .store-card {
      padding: 14px 6px;
      container-type: inline-size;
    }
    .store-card .closed .wait { font-size: clamp(9px, 13cqw, 14px); }
    .store-card .stop-time { font-size: clamp(8px, 10cqw, 11px); }
  }

  /* ── 平板 (≤ 900px) ─────────────────────────── */
  @media (max-width: 900px) {
    body { padding: 14px 14px; }
    header h1 { font-size: 20px; letter-spacing: 1px; }
    header .sub { font-size: 11px; }

    .overview {
      grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }
    .store-card { padding: 10px 6px; }
    .store-card .name { font-size: 12px; margin-bottom: 4px; }
    .store-card .wait { font-size: 22px; }

    .chart-wrap, .table-wrap { padding: 14px; border-radius: 10px; }
    .chart-container { height: 280px; }
    table { font-size: 11.5px; }
    thead th { padding: 6px 8px; }
    tbody td { padding: 5px 8px; }
  }

  /* ── 手機 (≤ 600px) ─────────────────────────── */
  @media (max-width: 600px) {
    body { padding: 10px 10px; }
    header { margin-bottom: 14px; }
    header h1 { font-size: 17px; letter-spacing: 0.5px; }
    header .sub { font-size: 10.5px; line-height: 1.5; }

    .overview {
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 6px;
      margin-bottom: 14px;
    }
    .store-card { padding: 8px 4px; border-radius: 8px; }
    .store-card .name { font-size: 11px; margin-bottom: 2px; }
    .store-card .wait { font-size: 20px; }
    .store-card .unit { font-size: 10px; }
    .store-card .closed .wait { font-size: 12px; }

    /* 圖表 / 表格容器縮小 padding */
    .chart-wrap, .table-wrap {
      padding: 12px 10px;
      margin-bottom: 14px;
      border-radius: 8px;
    }
    .chart-header, .table-header {
      gap: 6px; margin-bottom: 8px;
      flex-direction: column;
      align-items: flex-start;
    }
    .chart-header h2, .table-header h2 { font-size: 13px; }
    .chart-filter { width: 100%; justify-content: space-between; }
    .chart-filter select, .table-header select {
      font-size: 12px; padding: 3px 8px; flex: 1;
    }
    .chart-container { height: 240px; }

    /* 表格 — 隱藏次要欄位讓主要資訊可讀 */
    .col-togo { display: none; }
    table { font-size: 11px; }
    thead th { padding: 5px 4px; font-size: 10.5px; }
    tbody td { padding: 4px 4px; }
    .scroll-box { max-height: 360px; }

    .site-footer {
      margin-top: 22px;
      padding: 14px 14px;
      font-size: 11px;
      line-height: 1.65;
    }
    .site-footer .row { margin: 3px 0; }
  }

  /* ── 超小螢幕 (≤ 380px，iPhone SE) ──────────── */
  @media (max-width: 380px) {
    .overview {
      grid-template-columns: repeat(3, 1fr);
    }
    .store-card .wait { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <h1>鼎泰豐全分店 — 候位監控</h1>
  <div class="date-picker">
    <label>日期：</label>
    <select id="dateFilter"></select>
    <span class="update-note">資料每 60 秒更新</span>
  </div>
</header>

<div class="overview" id="overview"></div>

<div class="chart-wrap">
  <div class="chart-header">
    <h2>各分店等候時間趨勢</h2>
    <div class="chart-legend" id="chartLegend"></div>
    <div class="chart-filter">
      <label>篩選分店:</label>
      <select id="chartFilter">
        <option value="__all__">全部分店</option>
      </select>
    </div>
  </div>
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="table-wrap">
  <div class="table-header">
    <h2>歷史紀錄</h2>
    <select id="tableFilter">
      <option value="__all__">全部分店</option>
    </select>
  </div>
  <div class="scroll-box">
    <table>
      <thead>
        <tr>
          <th>時間</th>
          <th>分店</th>
          <th>變化</th>
          <th>前值持續</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="refresh-info">
  上次更新: <span id="lastUpdate">-</span>
  &nbsp;|&nbsp; 總筆數: <span id="totalRows">0</span>
</div>

<footer class="site-footer">
  <div class="row">
    資料來源：<a href="https://www.dintaifung.tw/Queue/?type=3" target="_blank" rel="noopener">鼎泰豐官方候位查詢網頁</a>
  </div>
  <div class="row">
    本站為獨立開發專案，與鼎泰豐無任何關係，資料僅供參考。
  </div>
  <div class="row">
    候位紀錄為鼎泰豐官網公開資訊之事實觀測，本站不主張其著作權，歡迎自由取用。
  </div>
  <div class="row">
    回報問題：<a href="https://github.com/dannynycc/DinTaiFung-Wait-Time-Monitor/issues" target="_blank" rel="noopener">GitHub Issues</a>
  </div>
  <div class="row">
    <a class="license" href="https://github.com/dannynycc/DinTaiFung-Wait-Time-Monitor/blob/main/LICENSE" target="_blank" rel="noopener">程式碼 MIT 授權</a>
  </div>
</footer>

<script>
// ── 顏色配置 ─────────────────────────────────────
const STORE_COLORS = {
  '信義店': '#e53935', '復興店': '#8e24aa', '天母店': '#1e88e5',
  '新竹店': '#43a047', '101店':  '#f4511e', '台中店': '#00897b',
  // 板橋店原 #fdd835 對白底僅 1.4 對比、新生店原 #7cb342 與新竹店色差僅 ΔE 18，
  // 兩者當色帶都不堪用。詳見 docs/index.html 的說明。
  '板橋店': '#b8860b', '高雄店': '#6d4c41', '南西店': '#d81b60',
  'A4店':   '#3949ab', 'A13店':  '#00acc1', '新生店': '#546e7a',
};
function storeColor(name) { return STORE_COLORS[name] || '#8b4513'; }

// ── 狀態 ─────────────────────────────────────────
let allRows = [];
let knownStores = [];
let selectedStore = '__all__';
let chartStoresAll = [];        // 當天有資料的全部分店（不受篩選影響，圖例用）  // 圖表+表格+卡片 共用篩選
let selectedDate = todayStr();  // YYYY-MM-DD

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function dateLabel(dateStr) {
  const t = todayStr();
  if (dateStr === t) return `${dateStr}（今日）`;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(t + 'T00:00:00');
  const diff = Math.round((now - d) / 86400000);
  if (diff === 1) return `${dateStr}（昨日）`;
  if (diff === 2) return `${dateStr}（前日）`;
  const wd = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${dateStr}（週${wd}）`;
}

// ── Chart.js（含 hover 高亮 plugin）──────────────
//
// 效能：原本用 chart.update('none') 重繪，實測每次 6.54 ms。interaction 是
// { intersect: false, mode: 'nearest' }，滑鼠一動「最近的資料集」就在 11 條線之間跳，
// 幾乎每兩次 mousemove 就全圖重繪一次 —— 掃過圖表兩趟量到 1588 ms 的 JS 執行時間。
// 改成只改「元素」的 options 再 chart.render()（只重畫、不重算資料與比例尺），
// 並用 rAF 合併同一幀內的多次事件：JS 時間降 75%、主執行緒總量降 46%。
// （實測 getElementsAtEventForMode 只要 0.02 ms，偵測從來不是瓶頸。）
let lastHoveredIdx = -1;
let pendingHoverIdx = -1;
let hoverRafId = 0;

// hover 只改線的粗細與顏色，完全不碰圓點 —— 圓點在資料集設定裡就是 0
function paintHighlight(chart, activeIdx) {
  chart.data.datasets.forEach((ds, i) => {
    const meta = chart.getDatasetMeta(i);
    if (!meta.dataset) return;
    const base = storeColor(ds.label);
    const isActive = i === activeIdx;
    meta.dataset.options.borderWidth = activeIdx === -1 ? 2 : (isActive ? 4.5 : 1);
    meta.dataset.options.borderColor =
      (activeIdx !== -1 && !isActive) ? base + '40' : base;
  });
  chart.render();
}

function scheduleHighlight(chart, idx) {
  if (idx === lastHoveredIdx) return;
  pendingHoverIdx = idx;
  if (hoverRafId) return;
  hoverRafId = requestAnimationFrame(() => {
    hoverRafId = 0;
    if (pendingHoverIdx === lastHoveredIdx) return;
    lastHoveredIdx = pendingHoverIdx;
    paintHighlight(chart, pendingHoverIdx);
  });
}

const highlightPlugin = {
  id: 'legendHover',
  beforeEvent(chart, args) {
    const evt = args.event;
    if (evt.type === 'mouseout') { scheduleHighlight(chart, -1); return; }
    if (evt.type !== 'mousemove') return;

    // 偵測線條 hover
    const elements = chart.getElementsAtEventForMode(
      evt, 'dataset', { intersect: false }, false
    );
    let activeIdx = elements.length > 0 ? elements[0].datasetIndex : -1;

    // 圖例已改成 canvas 外的 HTML（見 renderLegend），hover 由 DOM 事件處理。

    scheduleHighlight(chart, activeIdx);
  }
};

// ── 線尾直接標示（direct labeling）─────────────────
// 在每條線的末端直接寫上「店名 50 分鐘」，用該店自己的顏色。
// 比對照下方圖例快得多：不必記「橘色是哪家」，答案就在線的旁邊。
//
// 三條規則：
//   1. y 一律採用該線末端的真實高度，全程不移動 —— 標籤永遠貼在自己的線上。
//      （曾經改用垂直推開，結果標籤離開自己的線，還被推出繪圖區。）
//   2. x 一律對齊同一條左邊界（所有線末端最右者 + 間距），像一欄清單。
//      只有真的會相疊的標籤才往右讓開，讓開之後仍是接在同一列上。
//      （曾經讓標籤「接在前一個之後」，結果高度相近但沒相疊的也被連鎖推開，
//        整欄參差不齊。）
//   3. 同一個數值超過 2 家就收合成「8 家 0 分鐘」。理由見下。
//   4. 放不下就縮小字級，不讓標籤溢出畫布。
const END_LABEL_OFFSET  = 8;      // 線末端到標籤左邊界的距離（px）
const END_LABEL_GAP_X   = 10;     // 同一列的標籤之間的水平間距（px）
const END_LABEL_NARROW  = 700;    // 低於此寬度改用精簡文字
const END_LABEL_SIZE    = 11;     // 基準字級（px）
const END_LABEL_SIZE_SM = 10;     // 窄畫面基準字級
const END_LABEL_MIN_SZ  = 8;      // 縮小的下限，再小就讀不到了
// 同一個候位分鐘數最多逐一列出幾家，超過就收合。
// 為什麼要收合：打烊前後常有一大批分店同時收在 0 分鐘（實測 2026-04-23 有
// 8 家），逐一列出光那一列就要 700px，為了容納它得把右側留白撐到整張圖的
// 三分之一 —— 犧牲資料去遷就標籤，本末倒置。而且那 8 條線在 0 分鐘上完全
// 重疊，看圖的人本來就分不出哪條是哪條，列出 8 個店名並沒有多給任何資訊。
//
// 窄畫面收得更緊（只列 1 家）：390px 的畫布上兩個標籤並排就要 30% 的寬度，
// 繪圖區會被壓到只剩 59% —— 跟桌機那個問題是同一回事，只是門檻更低。
const END_LABEL_MAX_ROW    = 2;
const END_LABEL_MAX_ROW_SM = 1;
const END_LABEL_GROUP_COLOR = '#6f6558';   // 收合標籤代表多家分店，用中性色

function endLabelFont(size) {
  return `600 ${size}px system-ui, sans-serif`;
}

function endLabelText(name, value, narrow) {
  // 窄畫面省略單位：y 軸標題已經寫了「分鐘」，而 11 個標籤各帶單位
  // 在 330px 寬的手機上會吃掉四分之一的繪圖區。
  return narrow ? `${name} ${value}` : `${name} ${value} 分鐘`;
}

function endLabelGroupText(count, value, narrow) {
  return narrow ? `${count} 家 ${value}` : `${count} 家 ${value} 分鐘`;
}

// 把「同一個數值超過 END_LABEL_MAX_ROW 家」的收合成單一標籤。
// 同值必然同高，所以這個分組跟畫面上的「列」是一致的。
// beforeLayout（算留白）與 afterDatasetsDraw（實際繪製）共用同一套規則，
// 否則會出現「留白照 8 個標籤算，畫出來卻只有 1 個」這種對不起來的情況。
function endLabelGroups(entries, narrow) {
  const maxRow = narrow ? END_LABEL_MAX_ROW_SM : END_LABEL_MAX_ROW;
  const byValue = new Map();
  for (const e of entries) {
    const g = byValue.get(e.value);
    if (g) g.push(e); else byValue.set(e.value, [e]);
  }
  const out = [];
  for (const [value, g] of byValue) {
    if (g.length <= maxRow) {
      out.push(...g.map(e => ({ ...e, text: endLabelText(e.name, value, narrow) })));
    } else {
      out.push({
        idx: -1,
        value,
        endX: Math.max(...g.map(e => e.endX)),
        y: g[0].y,
        color: END_LABEL_GROUP_COLOR,
        text: endLabelGroupText(g.length, value, narrow),
      });
    }
  }
  return out;
}

const endLabelsPlugin = {
  id: 'endLabels',

  // 在繪圖區右側留出標籤的空間。放在 beforeLayout 才能影響 Chart.js
  // 計算繪圖區的大小；在繪製階段才改會來不及，標籤會被畫布邊緣裁掉。
  //
  // 要留多寬取決於「最寬的一列」，而那不必等到畫的時候才知道 ——
  // 候位分鐘數相同的分店必然落在同一個高度，也就是同一列。
  // 直接用資料把同值的分組量出來就行（收合規則與繪製階段共用）。
  beforeLayout(chart) {
    const narrow = chart.width < END_LABEL_NARROW;
    const ctx = chart.ctx;
    const entries = [];
    chart.data.datasets.forEach((ds, i) => {
      if (!chart.isDatasetVisible(i)) return;
      const v = ds.data[ds.data.length - 1]?.y;
      if (!Number.isFinite(v)) return;
      entries.push({ idx: i, name: ds.label, value: v, endX: 0, y: 0 });
    });
    ctx.save();
    ctx.font = endLabelFont(narrow ? END_LABEL_SIZE_SM : END_LABEL_SIZE);
    const rowWidth = new Map();   // 候位分鐘數 → 該列標籤並排的總寬
    for (const g of endLabelGroups(entries, narrow)) {
      const w = ctx.measureText(g.text).width;
      const cur = rowWidth.get(g.value);
      rowWidth.set(g.value, cur === undefined ? w : cur + END_LABEL_GAP_X + w);
    }
    ctx.restore();
    let need = 0;
    for (const w of rowWidth.values()) need = Math.max(need, w);

    // 上限 22%：收合之後最寬的一列頂多兩個標籤（窄畫面一個），正常不會碰到
    // 這個上限；留著是防呆，真的碰到時改由 afterDatasetsDraw 縮小字級收拾。
    // 多給 12px 餘裕，免得只差幾 px 就整批縮小字級。
    const right = need > 0
      ? Math.min(Math.ceil(need) + END_LABEL_OFFSET + 12, Math.round(chart.width * 0.22))
      : 0;
    if (!chart.options.layout) chart.options.layout = {};
    const pad = chart.options.layout.padding;
    // 只動 right，保留其他方向既有的設定
    chart.options.layout.padding =
      (pad && typeof pad === 'object') ? { ...pad, right } : { right };
  },

  afterDatasetsDraw(chart) {
    const { ctx, chartArea } = chart;
    if (!chartArea) return;
    const narrow = chart.width < END_LABEL_NARROW;

    // 蒐集每條可見線的末端位置
    const entries = [];
    chart.data.datasets.forEach((ds, i) => {
      if (!chart.isDatasetVisible(i)) return;
      const meta = chart.getDatasetMeta(i);
      const pts = meta.data;
      if (!pts || pts.length === 0) return;
      const last = pts[pts.length - 1];
      if (!last || !Number.isFinite(last.x) || !Number.isFinite(last.y)) return;
      const value = ds.data[ds.data.length - 1]?.y;
      if (!Number.isFinite(value)) return;
      entries.push({
        idx: i,
        name: ds.label,
        value,
        // 夾在繪圖區內：歷史日的線末端會超出右緣
        endX: Math.min(last.x, chartArea.right),
        // y 就是這條線末端的真實高度，全程不更動
        y: Math.min(Math.max(last.y, chartArea.top), chartArea.bottom),
        color: storeColor(ds.label),
      });
    });
    if (entries.length === 0) return;

    // 同值超過 2 家就收合成一個標籤（規則與 beforeLayout 共用）
    const items = endLabelGroups(entries, narrow);

    ctx.save();
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    // 共同左邊界：取所有線末端最右的那一個，整欄標籤都從這裡開始。
    // 用最右者才不會有標籤壓在別條線的上方。
    const commonX = Math.max(...items.map(it => it.endX)) + END_LABEL_OFFSET;

    // 由上而下處理，順序才穩定 —— 否則同一批資料每次重繪的左右順序
    // 可能不同，畫面會跳。
    items.sort((a, b) => a.y - b.y || a.idx - b.idx);

    // 排位：每個標籤都從共同左邊界開始；若與已放好的標籤相撞
    //（垂直距離小於一行字高、水平又相交），就往右推到那個標籤之後。
    //
    // 不能改用「y 相近就歸成同一列、同列依序並排」—— 那會產生鏈式錯誤：
    // y 差 11px 的併入同列、差 13px 的另開一列，但新列可能只離某個成員
    // 2px，兩者都從左邊界起排就疊在一起。手機版（圖表矮、列距被壓縮）
    // 實測就是這樣壞的。逐一對照所有已放好的標籤才不會有這個漏洞。
    const layout = (size) => {
      ctx.font = endLabelFont(size);
      const lineH = size + 2;
      const placed = [];
      let rightMost = 0;
      for (const it of items) {
        const w = ctx.measureText(it.text).width;
        let x = commonX;
        for (let guard = 0; guard <= items.length; guard++) {
          const hit = placed.find(p => Math.abs(p.y - it.y) < lineH &&
                                       x < p.x2 && p.x1 < x + w);
          if (!hit) break;
          x = hit.x2 + END_LABEL_GAP_X;
        }
        it.x = x;
        placed.push({ x1: x, x2: x + w, y: it.y });
        rightMost = Math.max(rightMost, x + w);
      }
      return rightMost;
    };

    // 字級：縮到整批都放得下為止。beforeLayout 已經照基準字級留好空間，
    // 通常不會觸發；只有在 35% 上限擋住留白、或近似高度的標籤擠成一列時才會縮。
    let size = narrow ? END_LABEL_SIZE_SM : END_LABEL_SIZE;
    while (size > END_LABEL_MIN_SZ && layout(size) > chart.width - 2) size -= 0.5;
    layout(size);   // 用最終字級重算一次，確保 it.x 與 ctx.font 一致

    for (const it of items) {
      // 與線條的強調效果一致：有線被選中時，其餘標籤一起淡化，
      // 否則畫面上會出現「線淡了但標籤還很搶眼」的矛盾。
      const dim = lastHoveredIdx !== -1 && it.idx !== lastHoveredIdx;
      // 白色描邊：標籤有機會落在線條或格線上方，沒有描邊會糊成一團
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.strokeText(it.text, it.x, it.y);
      ctx.fillStyle = dim ? it.color + '40' : it.color;
      ctx.fillText(it.text, it.x, it.y);
    }
    ctx.restore();
  }
};

const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'line',
  data: { datasets: [] },
  plugins: [highlightPlugin, endLabelsPlugin],
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { intersect: false, mode: 'nearest' },
    scales: {
      x: {
        type: 'time',
        time: {
          parser: 'yyyy-MM-dd HH:mm:ss',
          unit: 'minute',
          tooltipFormat: 'HH:mm',
          displayFormats: {
            second: 'HH:mm', minute: 'HH:mm', hour: 'HH:mm'
          }
        },
        title: { display: true, text: '時間', color: '#999' },
        ticks: {
          color: '#999',
          // 格線每 30 分鐘一條、只標整點。
          // stepSize 必須放在 ticks 底下 —— Chart.js v3 之後時間軸的 stepSize
          // 從 time 移到了 ticks，放錯位置不會報錯，只會被安靜忽略。
          // autoSkip 會連格線一起拿掉，所以關掉它、改用 callback 回傳空字串隱藏文字。
          stepSize: 30,
          autoSkip: false,
          maxTicksLimit: 100,
          maxRotation: 0,
          callback: function(value) {
            const d = new Date(value);
            if (d.getMinutes() !== 0) return '';
            return String(d.getHours()).padStart(2,'0') + ':00';
          }
        },
        grid: { color: 'rgba(0,0,0,.05)' },
      },
      y: {
        beginAtZero: true,
        title: { display: true, text: '分鐘', color: '#999' },
        ticks: { color: '#999', stepSize: 5, precision: 0 },
        grid: { color: 'rgba(0,0,0,.05)' },
      }
    },
    plugins: {
      // Chart.js 內建的圖例畫在 canvas 裡，會吃掉繪圖區的高度。
      // 改成畫在圖表標題那一排的 HTML 圖例（見 renderLegend）。
      legend: { display: false },
      tooltip: {
        backgroundColor: 'rgba(60,30,10,0.9)',
        titleFont: { size: 12 }, bodyFont: { size: 13 },
        mode: 'nearest',
        intersect: false,
        callbacks: {
          title: function(items) {
            if (!items.length) return '';
            const raw = items[0].raw || items[0].element || {};
            const x = raw.x || items[0].label || '';
            return String(x).replace(/:\d{2}$/, '');
          },
          label: c => c.dataset.label + ': ' + c.parsed.y + ' 分鐘'
        }
      }
    }
  }
});

// ── 工具 ─────────────────────────────────────────
function createEl(tag, text, className) {
  const el = document.createElement(tag);
  if (text != null) el.textContent = text;
  if (className) el.className = className;
  return el;
}

// ── wait_time 的型別 ─────────────────────────────
// 官方 API 的 wait_time 不保證是數字：'125'、'-1'（尚未營業）、
// 「已停止內用取號」三種都會出現。原本只認得 '-1'，中文字串會被當成數字處理。
function waitNumber(wt) {
  if (wt === null || wt === undefined || wt === '' || wt === '-1') return null;
  const n = Number(wt);
  return Number.isFinite(n) ? n : null;
}

function waitLabel(wt) {
  if (wt === '-1') return '尚未營業';
  return wt;   // 例如「已停止內用取號」，原樣顯示不加單位
}

// ── 篩選控制 ─────────────────────────────────────
function setFilter(storeName) {
  selectedStore = storeName;
  document.getElementById('chartFilter').value = storeName;
  document.getElementById('tableFilter').value = storeName;
  // 更新卡片 selected 狀態
  document.querySelectorAll('.store-card').forEach(card => {
    const cn = card.dataset.store;
    card.classList.toggle('selected', storeName !== '__all__' && cn === storeName);
  });
  renderChart();
  renderTable();
}

function populateDropdowns(storeNames) {
  const chartSel = document.getElementById('chartFilter');
  const tableSel = document.getElementById('tableFilter');

  // 記住目前的值
  const curVal = selectedStore;

  // 清除舊選項（保留第一個「全部」）
  while (chartSel.options.length > 1) chartSel.remove(1);
  while (tableSel.options.length > 1) tableSel.remove(1);

  for (const name of storeNames) {
    chartSel.appendChild(new Option(name, name));
    tableSel.appendChild(new Option(name, name));
  }

  chartSel.value = curVal;
  tableSel.value = curVal;
}

document.getElementById('chartFilter').addEventListener('change', function() {
  setFilter(this.value);
});
document.getElementById('tableFilter').addEventListener('change', function() {
  setFilter(this.value);
});

// ── 分組工具 ─────────────────────────────────────
function groupByStore(rows) {
  const byStore = {};
  for (const r of rows) {
    const name = r.store_name;
    if (!byStore[name]) byStore[name] = [];
    byStore[name].push(r);
  }
  return byStore;
}

// 把 unix timestamp 格式化成 HH:MM
function fmtStopTime(unixTs) {
  if (!unixTs || unixTs === 0) return null;
  const d = new Date(unixTs * 1000);
  return String(d.getHours()).padStart(2,'0') + ':' +
         String(d.getMinutes()).padStart(2,'0');
}

// 依停止取號時間判斷熱度（越早 = 越熱）
function stopTimeHeat(unixTs) {
  if (!unixTs) return 'unset';
  const d = new Date(unixTs * 1000);
  const h = d.getHours() + d.getMinutes() / 60;
  if (h < 18.5) return 'hot';
  if (h < 19.0) return 'warm';
  return '';
}

// 卡片 hover → 對應的線加粗、其餘變淡（與圖表內 hover 走同一條低成本路徑）
function hoverStoreFromCard(name) {
  if (!chart) return;
  const idx = name === null ? -1 : chart.data.datasets.findIndex(ds => ds.label === name);
  scheduleHighlight(chart, idx);
}

function attachCardHover(card, name) {
  card.addEventListener('mouseenter', () => hoverStoreFromCard(name));
  card.addEventListener('mouseleave', () => hoverStoreFromCard(null));
}

// ── 渲染：卡片（用 /api/latest 給每店「現在」的值）───
function renderCards(latestList) {
  const overview = document.getElementById('overview');
  overview.replaceChildren();

  // 桌機版靠這個變數把 grid 欄數釘成分店數，確保排成一列
  overview.style.setProperty('--store-count', String(latestList.length));

  for (const r of latestList) {
    const name = r.store_name;
    const wt = r.wait_time;
    const wn = waitNumber(wt);
    const isClosed = wn === null;   // '-1' 與「已停止內用取號」都算

    const card = document.createElement('div');
    card.className = 'store-card';
    card.style.borderLeftColor = storeColor(name);
    if (selectedStore !== '__all__' && selectedStore === name) {
      card.classList.add('selected');
    }
    card.dataset.store = name;

    card.addEventListener('click', () => {
      setFilter(selectedStore === name ? '__all__' : name);
    });
    attachCardHover(card, name);

    card.appendChild(createEl('div', name, 'name'));
    if (isClosed) {
      // 非數值狀態不加「分鐘」單位，否則會出現「已停止內用取號 分鐘」
      const wrap = createEl('div', null, 'closed');
      wrap.appendChild(createEl('span', waitLabel(wt), 'wait'));
      card.appendChild(wrap);
    } else {
      card.appendChild(createEl('span', String(wn), 'wait'));
      card.appendChild(createEl('span', ' 分鐘', 'unit'));
    }

    // 預計停止取號時間 —— 只在真的有值時才顯示。
    // 無值時原本印「止號 尚未設定」，那對使用者沒有用處，只是佔掉一行。
    const stopStr = fmtStopTime(r.last_time);
    if (stopStr) {
      const stopDiv = document.createElement('div');
      stopDiv.className = 'stop-time ' + stopTimeHeat(r.last_time);
      stopDiv.appendChild(createEl('span', '止號 ', 'label'));
      stopDiv.appendChild(createEl('span', stopStr));
      card.appendChild(stopDiv);
    }

    overview.appendChild(card);
  }
}

// ── 把 changes 轉成 chart datasets（step line）───
// 邏輯：每個 change event 是一個 (timestamp, wait_time)。
// Chart.js 用 stepped:'before' → 線條會在 timestamp 時刻「跳」到新值。
// 為了讓最後一段值有畫到「現在」，幫每店多補一個延伸點到當日最末。
// ── 上游 API 的瞬間毛刺 ──────────────────────────
// 官方端點偶爾在單一取樣回報異常低值，下一分鐘又跳回原值。實測 8 天 5,356 個
// 變化事件中有 30 筆（0.56%），例如：
//   高雄店 20:58  已停止內用取號 → 0 → 已停止內用取號（只持續 1 分鐘）
//   新竹店 12:34  120 → 0 → 120
//   南西店 16:11  110 → 10 → 120
// 一家已停止取號的店不可能真的變成「等候 0 分鐘」再變回停止。
//
// 判定：值只持續 ≤1 分鐘，且 (a) 前後皆為數值、掉到較小者一半以下且絕對落差 ≥30 分鐘，
// 或 (b) 前後是相同的非數值狀態而此值為 0。
// 絕對門檻是必要的：只用相對比例會在低數值區大量誤殺（5 → 0 → 5 是短隊真的排空，
// 每天都在發生）。官方以 5 分鐘為級距更新，一分鐘掉 30 分鐘等於連跌 6 級再連漲 6 級。
//
// 只影響圖表繪製，原始資料完全不動，表格照常列出並標示。
const GLITCH_MAX_MIN = 1;
const GLITCH_DROP_RATIO = 0.5;
const GLITCH_SAME_DROP = 10;   // 前後值相同時的絕對落差門檻
const GLITCH_DIFF_DROP = 30;   // 前後值不同時（較保守）
let glitchSet = new Set();

function findGlitches(rows) {
  const byStore = {};
  for (const r of rows) {
    if (!byStore[r.store_id]) byStore[r.store_id] = [];
    byStore[r.store_id].push(r);
  }
  const found = new Set();
  for (const evs of Object.values(byStore)) {
    for (let i = 0; i < evs.length; i++) {
      const e = evs[i];
      const nxt = evs[i + 1];
      if (!nxt) continue;
      const held = nxt.duration_min;
      if (held === null || held === undefined || held > GLITCH_MAX_MIN) continue;
      const cur = waitNumber(e.wait_time);
      if (cur === null) continue;
      const prev = waitNumber(e.prev_value);
      const next = waitNumber(nxt.wait_time);
      if (prev !== null && next !== null) {
        const floor = Math.min(prev, next);
        if (cur > floor * GLITCH_DROP_RATIO) continue;
        const need = (e.prev_value === nxt.wait_time) ? GLITCH_SAME_DROP : GLITCH_DIFF_DROP;
        if (floor - cur >= need) found.add(e);
      } else if (e.prev_value !== null && e.prev_value === nxt.wait_time && cur === 0) {
        found.add(e);
      }
    }
  }
  return found;
}

// 非數值事件（'-1'、「已停止內用取號」）不畫成點，但要記下「線在此刻終止」。
// 舊版直接 continue 掉，導致延伸邏輯拿最後一個數值一路畫到現在 ——
// 店家早就停止取號，圖表卻宣稱候位時間仍維持在那個值。
function buildChartDatasets(changes, dateStr) {
  const byStore = {};
  const stoppedAt = {};   // store_name → 停止取號的時間戳
  for (const r of changes) {
    if (glitchSet.has(r)) continue;   // 上游瞬間毛刺，不畫（資料仍保留）
    const n = waitNumber(r.wait_time);
    if (n === null) {
      if (byStore[r.store_name]) stoppedAt[r.store_name] = r.timestamp;
      continue;
    }
    delete stoppedAt[r.store_name];   // 恢復報數就清掉終止標記
    if (!byStore[r.store_name]) byStore[r.store_name] = [];
    byStore[r.store_name].push({ x: r.timestamp, y: n });
  }

  // 延伸線到當日最末（看歷史 = 當日 23:59:59；看今日 = 當下時間）
  const isToday = dateStr === todayStr();
  const tail = isToday
    ? new Date()
    : new Date(dateStr + 'T23:59:59');
  const tailStr = dateStr + ' ' +
    String(tail.getHours()).padStart(2,'0') + ':' +
    String(tail.getMinutes()).padStart(2,'0') + ':' +
    String(tail.getSeconds()).padStart(2,'0');

  // 圖例要一直列出所有分店，否則篩成單店之後就沒辦法直接切換到另一家
  chartStoresAll = Object.keys(byStore);

  const showStores = selectedStore === '__all__'
    ? chartStoresAll.slice()
    : (byStore[selectedStore] ? [selectedStore] : []);

  const datasets = [];
  for (const name of showStores) {
    const pts = byStore[name].slice();
    // 已停止取號的店只延到「停止的那一刻」，不延到現在
    if (pts.length > 0) {
      const end = stoppedAt[name] || tailStr;
      pts.push({ x: end, y: pts[pts.length - 1].y });
    }
    const color = storeColor(name);
    const single = showStores.length === 1;
    datasets.push({
      label: name,
      data: pts,
      borderColor: color,
      backgroundColor: color + '20',
      borderWidth: 2,
      // 一律不畫圓點（單店檢視也一樣）：步階線的轉折本身已標示變化時刻，
      // 圓點是重複資訊；多店時更會直接蓋掉線條。
      // 只保留 hover 時游標底下那一顆，當 tooltip 的錨點。
      pointRadius: 0,
      pointHoverRadius: 4,
      pointBackgroundColor: color,
      stepped: 'before',  // 步階線：橫線維持到下個變化點才跳
      fill: single,
    });
  }
  return datasets;
}

// 時間軸範圍用「當日全部分店」的資料計算，不用篩選後的子集 —— 否則點某一家店，
// 時間軸會縮成那家店自己的範圍，跟全部分店的視圖對不起來。
// 本機版不套用 09:00–21:30 的下限：app.py 是 24 小時收集，套雲端的抓取視窗會裁掉真資料。
function applyAxisRange() {
  let min = null, max = null;
  for (const r of allRows) {
    if (min === null || r.timestamp < min) min = r.timestamp;
    if (max === null || r.timestamp > max) max = r.timestamp;
  }
  chart.options.scales.x.min = min ?? undefined;
  chart.options.scales.x.max = max ?? undefined;
}

// ── 圖表圖例（HTML，畫在標題那一排）─────────────────
// 原本用 Chart.js 內建的圖例，它畫在 canvas 底部、吃掉繪圖區的高度。
// 搬成 HTML 之後那些高度全部還給繪圖區，y 軸的分鐘間距因此拉開。
//
// 搬出 canvas 也代表 hover 高亮不能再靠 legendHitBoxes 比對座標，
// 改由 DOM 事件驅動 —— 行為要跟原本一致：移過去高亮該條線，點下去單獨檢視。
function datasetIndexOf(name) {
  return chart.data.datasets.findIndex(d => d.label === name);
}

function renderLegend() {
  const box = document.getElementById('chartLegend');
  if (!box) return;
  const frag = document.createDocumentFragment();
  for (const name of chartStoresAll) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'lg-item';
    btn.setAttribute('aria-pressed', String(selectedStore === name));
    btn.setAttribute('aria-label',
      selectedStore === name ? `${name}（目前單獨檢視，按下顯示全部分店）` : `只看 ${name}`);
    const sw = document.createElement('i');
    // 色塊用 currentColor 畫外框，所以顏色設在元素本身
    sw.style.color = storeColor(name);
    btn.appendChild(sw);
    btn.appendChild(document.createTextNode(name));

    const on  = () => scheduleHighlight(chart, datasetIndexOf(name));
    const off = () => scheduleHighlight(chart, -1);
    btn.addEventListener('mouseenter', on);
    btn.addEventListener('mouseleave', off);
    btn.addEventListener('focus', on);
    btn.addEventListener('blur', off);
    btn.addEventListener('click', () => {
      setFilter(selectedStore === name ? '__all__' : name);
    });
    frag.appendChild(btn);
  }
  box.replaceChildren(frag);
}

function renderChart() {
  // 取消還沒執行的 hover 重繪：它帶的是改版前的 dataset 索引，
  // 點卡片時 mouseenter 與 click 同時發生，等 rAF 執行時舊索引已不存在，
  // 會讓篩選後唯一那條線被誤判為「非高亮」而整條淡化。
  if (hoverRafId) { cancelAnimationFrame(hoverRafId); hoverRafId = 0; }
  pendingHoverIdx = -1;

  chart.data.datasets = buildChartDatasets(allRows, selectedDate);
  applyAxisRange();
  chart.update('none');
  // update() 會重新解析元素樣式，等於沖掉 hover 高亮 —— 歸零讓下次滑動重新套用
  lastHoveredIdx = -1;
  renderLegend();
}

// ── 渲染：表格（transition log）─────────────────
const MAX_TABLE_ROWS = 500;

function fmtDuration(min) {
  if (min === null || min === undefined) return '—';
  if (min < 60) return `${min} 分`;
  const h = Math.floor(min / 60), m = min % 60;
  return m === 0 ? `${h} 小時` : `${h}小時${m}分`;
}

function fmtChange(prev, next) {
  // 非數值狀態原樣顯示，不加「分」（否則會出現「已停止內用取號分」）
  const fmtVal = (v) => {
    const n = waitNumber(v);
    return n === null ? waitLabel(v) : `${n}分`;
  };
  if (prev === null || prev === undefined) return fmtVal(next);  // 起點
  return `${fmtVal(prev)} → ${fmtVal(next)}`;
}

function renderTable() {
  const filtered = selectedStore === '__all__'
    ? allRows
    : allRows.filter(r => r.store_name === selectedStore);

  const totalCount = filtered.length;
  const showRows = totalCount > MAX_TABLE_ROWS
    ? filtered.slice(-MAX_TABLE_ROWS)
    : filtered;

  const frag = document.createDocumentFragment();
  for (let i = showRows.length - 1; i >= 0; i--) {
    const r = showRows[i];
    const tr = document.createElement('tr');

    // 時間（含秒）
    tr.appendChild(createEl('td', r.timestamp));
    tr.appendChild(createEl('td', r.store_name));

    // 變化欄：轉入非數值狀態（未營業／已停止取號）用淡色標示
    const isClosing = waitNumber(r.wait_time) === null;
    const cls = isClosing ? 'td-closed' : 'td-wait';
    const td = createEl('td', fmtChange(r.prev_value, r.wait_time), cls);
    // 毛刺照常列出，只加標記 —— 表格是稽核紀錄，隱藏它跟畫出不存在的線一樣不可接受
    if (glitchSet.has(r)) {
      tr.classList.add('glitch-row');
      td.title = '疑似上游 API 瞬間錯誤回報：此值只持續 1 分鐘且掉超過一半後即彈回。圖表不繪製此點，資料仍完整保留。';
      td.appendChild(createEl('span', ' ※', 'glitch-mark'));
    }
    tr.appendChild(td);

    tr.appendChild(createEl('td', fmtDuration(r.duration_min)));
    frag.appendChild(tr);
  }

  document.getElementById('tableBody').replaceChildren(frag);

  document.getElementById('totalRows').textContent =
    totalCount > MAX_TABLE_ROWS
      ? `${totalCount} 個變化（顯示最新 ${MAX_TABLE_ROWS}）`
      : `${totalCount} 個變化`;
  document.getElementById('lastUpdate').textContent =
    new Date().toLocaleTimeString('zh-TW', { hour12: false });
}

// ── 主渲染 ──────────────────────────────────────
function render(changesRows, latestList) {
  allRows = changesRows;
  glitchSet = findGlitches(allRows);
  // 下拉店家清單從 latestList 抽（因為 latest 一定有所有「目前活躍」的店）
  const newStores = latestList.map(r => r.store_name);
  if (newStores.join() !== knownStores.join()) {
    knownStores = newStores;
    populateDropdowns(knownStores);
  }
  renderCards(latestList);
  renderChart();
  renderTable();
}

// ── 定時拉資料 ──────────────────────────────────
// Codex 2026-05-08 10:22 +08:00：前端輪詢加上 in-flight guard 與逾時取消，避免斷線時堆積未完成 fetch。
const FETCH_TIMEOUT_MS = 10000;
let refreshInFlight = false;
let refreshController = null;

async function fetchJson(url, signal) {
  const resp = await fetch(url, { signal });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function refresh(options = {}) {
  if (refreshInFlight) {
    if (!options.force) return;
    if (refreshController) refreshController.abort();
  }

  refreshInFlight = true;
  const requestDate = selectedDate;
  const controller = new AbortController();
  refreshController = controller;
  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

  try {
    const [changes, latest] = await Promise.all([
      fetchJson(`/api/changes?date=${encodeURIComponent(requestDate)}`, controller.signal),
      fetchJson('/api/latest', controller.signal),
    ]);
    if (selectedDate === requestDate) render(changes, latest);
  } catch (e) {
    if (e.name !== 'AbortError') console.error('fetch error:', e);
  } finally {
    clearTimeout(timeoutId);
    if (refreshController === controller) {
      refreshInFlight = false;
      refreshController = null;
    }
  }
}

let autoRefreshTimer = null;
function setupAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  // 只在「今日」才自動刷新（歷史日資料不會變，省 CPU）
  if (selectedDate === todayStr()) {
    autoRefreshTimer = setInterval(refresh, 15000);
  }
}

async function populateDateDropdown() {
  try {
    const dates = await (await fetch('/api/dates')).json();
    // 確保今天一定在清單裡（剛開新的一天、DB 還沒資料時）
    const t = todayStr();
    const set = new Set(dates);
    if (!set.has(t)) dates.unshift(t);

    const sel = document.getElementById('dateFilter');
    sel.replaceChildren();
    for (const d of dates) {
      sel.appendChild(new Option(dateLabel(d), d));
    }
    sel.value = selectedDate;
  } catch (e) {
    console.error('dates fetch error:', e);
  }
}

document.getElementById('dateFilter').addEventListener('change', function() {
  selectedDate = this.value;
  // 保留分店篩選（切昨日 → 依然顯示同一家店的昨日資料）
  refresh({ force: true });
  setupAutoRefresh();  // 切歷史日就停 timer，切回今日就恢復
});

(async () => {
  await populateDateDropdown();
  refresh();
  setupAutoRefresh();
  // 每 10 分鐘重新掃日期清單（跨午夜後能自動出現新的今日選項）
  setInterval(populateDateDropdown, 600000);
})();
</script>

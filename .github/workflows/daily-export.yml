name: daily-export

# 每天把前一日的變化事件從 D1 撈出來，存成 docs/data/YYYY-MM-DD.json 進 repo。
# 這樣歷史資料在 GitHub 上直接可下載，前端讀靜態檔也不吃 Worker 額度。
# 一天只產生一個 commit。

on:
  schedule:
    # UTC 19:00 = 台北 03:00。避開整點與 UTC 00:00，GitHub 排程在熱門時段延遲較嚴重。
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定匯出日期 YYYY-MM-DD（留空 = 前一日）'
        required: false
        type: string

permissions:
  contents: write

env:
  # runner 預設 UTC，不設這個的話 date 算出來的「昨天」會在台北時間 08:00 前後錯一天
  TZ: Asia/Taipei
  API_BASE: https://dintaifung-queue.dannynycc.workers.dev

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 決定匯出日期
        id: pick
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            d="${{ inputs.date }}"
          else
            d=$(date -d 'yesterday' +%F)
          fi
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "匯出日期（台北）：$d"

      - name: 從 D1 撈變化事件
        id: fetch
        run: |
          d="${{ steps.pick.outputs.date }}"
          mkdir -p docs/data
          curl -sS --fail --max-time 60 \
            "$API_BASE/api/changes?date=$d" -o /tmp/day.json
          n=$(python3 -c "import json;print(len(json.load(open('/tmp/day.json'))))")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "取得 $n 筆變化事件"

      - name: 空資料就中止，不要用空檔覆蓋既有檔案
        if: steps.fetch.outputs.count == '0'
        run: |
          echo "::warning::${{ steps.pick.outputs.date }} 沒有任何變化事件，跳過寫入。"
          echo "可能原因：Worker cron 當天沒跑、或該日確實無資料。請查 /api/health。"
          exit 0

      - name: 寫入 docs/data 並重建索引
        if: steps.fetch.outputs.count != '0'
        run: |
          d="${{ steps.pick.outputs.date }}"
          python3 - "$d" <<'PY'
          import json, os, sys
          date = sys.argv[1]
          rows = json.load(open('/tmp/day.json'))
          os.makedirs('docs/data', exist_ok=True)
          with open(f'docs/data/{date}.json', 'w', encoding='utf-8') as f:
              json.dump(rows, f, ensure_ascii=False, separators=(',', ':'))
          dates = sorted(
              f[:-5] for f in os.listdir('docs/data')
              if f.endswith('.json') and f != 'index.json' and len(f) == 15
          )
          with open('docs/data/index.json', 'w', encoding='utf-8') as f:
              json.dump(dates, f, separators=(',', ':'))
          print(f'寫入 {date}.json（{len(rows)} 筆），索引共 {len(dates)} 天')
          PY

      - name: 抓取健康度檢查（cron 是否有漏跑）
        if: steps.fetch.outputs.count != '0'
        continue-on-error: true
        run: |
          curl -sS --max-time 30 "$API_BASE/api/health" -o /tmp/health.json || exit 0
          python3 - <<'PY'
          import json
          h = json.load(open('/tmp/health.json'))
          bad = [r for r in h if r['fail_count'] or r['note']]
          if bad:
              print('::warning::近期抓取有異常：')
              for r in bad[:5]:
                  print(f"  {r['timestamp']} ok={r['ok_count']} fail={r['fail_count']} {r['note']}")
          else:
              print(f'近 {len(h)} 次抓取全部正常')
          PY

      - name: commit
        if: steps.fetch.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "沒有變更，不建立 commit"
          else
            git commit -m "data: ${{ steps.pick.outputs.date }} 候位變化事件（${{ steps.fetch.outputs.count }} 筆）"
            git push
          fi

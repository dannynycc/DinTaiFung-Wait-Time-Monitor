name: daily-export

# 每天把前一日的變化事件從 D1 撈出來，存成 docs/data/YYYY-MM-DD.json 進 repo。
# 這樣歷史資料在 GitHub 上直接可下載，前端讀靜態檔也不吃 Worker 額度。
# 一天只產生一個 commit。

on:
  schedule:
    # UTC 19:00 = 台北 03:00。避開整點與 UTC 00:00，GitHub 排程在熱門時段延遲較嚴重。
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定匯出日期 YYYY-MM-DD（留空 = 前一日）'
        required: false
        type: string

permissions:
  contents: write

env:
  # runner 預設 UTC，不設這個的話 date 算出來的「昨天」會在台北時間 08:00 前後錯一天
  TZ: Asia/Taipei
  API_BASE: https://dintaifung-queue.dannynycc.workers.dev

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 決定匯出日期
        id: pick
        # 使用者輸入透過 env 傳入，不直接內插進 shell —— 直接寫 ${{ inputs.date }}
        # 在 run: 區塊裡是標準的 GitHub Actions 指令注入模式。
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          d="${INPUT_DATE:-$(date -d 'yesterday' +%F)}"
          if ! echo "$d" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::日期格式不合法：$d"
            exit 1
          fi
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "匯出日期（台北）：$d"

      - name: 從 D1 撈變化事件
        id: fetch
        run: |
          d="${{ steps.pick.outputs.date }}"
          mkdir -p docs/data
          curl -sS --fail --max-time 60 \
            "$API_BASE/api/changes?date=$d" -o /tmp/day.json
          # 一定要驗型別：若端點回的是 {"error": ...} 這種物件，len() 會是 1
          # 而不是 0，空檔保護就失效，錯誤物件會被當成一天的資料寫進 repo。
          n=$(python3 -c "
          import json, sys
          d = json.load(open('/tmp/day.json'))
          if not isinstance(d, list):
              print(f'::error::/api/changes 回傳的不是陣列：{str(d)[:200]}', file=sys.stderr)
              sys.exit(1)
          print(len(d))
          ")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "取得 $n 筆變化事件"

      - name: 空資料就中止，不要用空檔覆蓋既有檔案
        if: steps.fetch.outputs.count == '0'
        run: |
          echo "::warning::${{ steps.pick.outputs.date }} 沒有任何變化事件，跳過寫入。"
          echo "後續的健康度檢查會判斷這是 cron 中斷還是該日確實無資料。"

      - name: 寫入 docs/data 並重建索引
        if: steps.fetch.outputs.count != '0'
        run: |
          d="${{ steps.pick.outputs.date }}"
          python3 - "$d" <<'PY'
          import json, os, sys
          date = sys.argv[1]
          rows = json.load(open('/tmp/day.json'))
          os.makedirs('docs/data', exist_ok=True)
          with open(f'docs/data/{date}.json', 'w', encoding='utf-8') as f:
              json.dump(rows, f, ensure_ascii=False, separators=(',', ':'))
          dates = sorted(
              f[:-5] for f in os.listdir('docs/data')
              if f.endswith('.json') and f != 'index.json' and len(f) == 15
          )
          with open('docs/data/index.json', 'w', encoding='utf-8') as f:
              json.dump(dates, f, separators=(',', ':'))
          print(f'寫入 {date}.json（{len(rows)} 筆），索引共 {len(dates)} 天')
          PY

      # 刻意「不」加 if 條件：這個診斷步驟最有價值的時刻，正是前一步取得
      # 0 筆資料的時候（代表 Worker cron 可能整天沒跑）。原本它被
      # `if: count != '0'` 擋住，等於在唯一需要它的情況下不執行。
      # 也不加 continue-on-error：真的斷線就該讓這個 job 紅燈，
      # 綠燈加一行沒人看的 warning 等於沒有告警。
      - name: 抓取健康度檢查（cron 是否有漏跑）
        if: always() && steps.pick.outcome == 'success'
        run: |
          if ! curl -sS --fail --max-time 30 "$API_BASE/api/health" -o /tmp/health.json; then
            echo "::error::無法取得 /api/health —— Worker 可能整個掛了"
            exit 1
          fi
          COUNT="${{ steps.fetch.outputs.count }}" python3 - <<'PY'
          import json, os, sys, datetime
          h = json.load(open('/tmp/health.json'))
          if not h:
              print('::error::fetch_health 完全沒有紀錄 —— cron 從未成功執行')
              sys.exit(1)

          # RETRY_OK 是「失敗後自我修復成功」的訊號，不是告警來源。
          # 原本的條件是 `if r['fail_count'] or r['note']`，會把每個重試成功的
          # 週期都誤報成異常 —— 我自己加的 RETRY_OK 觸發了我自己寫的告警。
          def is_bad(r):
              note = r.get('note') or ''
              real = [p for p in note.split(' | ')
                      if p and not p.startswith('RETRY_OK') and not p.startswith('ROLLUP_NOOP')]
              return bool(real)

          bad = [r for r in h if is_bad(r)]
          latest = max(r['timestamp'] for r in h)
          age_min = (datetime.datetime.now() - datetime.datetime.strptime(latest, '%Y-%m-%d %H:%M:%S')).total_seconds() / 60

          print(f'最近一次抓取：{latest}（{age_min:.0f} 分鐘前）')
          print(f'近 {len(h)} 次紀錄中，有實質問題的 {len(bad)} 次')
          for r in bad[:5]:
              print(f"  {r['timestamp']} ok={r['ok_count']} fail={r['fail_count']} {r['note']}")

          # 本 workflow 在台北 03:00 執行，抓取視窗收在 21:30，
          # 所以正常情況下最近一次抓取就是 5.5 小時前（330 分鐘）—— 這是預期值不是異常。
          # 門檻取 420 分鐘：代表昨天比預定時間提早 1.5 小時以上斷線才告警。
          # （抓取視窗若再調整，這個數字要跟著改，否則不是每天誤報就是永遠不報。）
          STALE_LIMIT_MIN = 420
          if age_min > STALE_LIMIT_MIN:
              print(f'::error::最近一次抓取在 {age_min:.0f} 分鐘前（門檻 {STALE_LIMIT_MIN}）—— cron 可能提早中斷')
              sys.exit(1)
          if os.environ.get('COUNT') == '0':
              print('::error::前一日沒有任何變化事件，但 cron 有在跑 —— 請人工確認')
              sys.exit(1)
          PY

      - name: commit
        if: steps.fetch.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "沒有變更，不建立 commit"
          else
            git commit -m "data: ${{ steps.pick.outputs.date }} 候位變化事件（${{ steps.fetch.outputs.count }} 筆）"
            git push
          fi

name: daily-export

# 每天把前一日的變化事件從 D1 撈出來，存成 docs/data/YYYY-MM-DD.json 進 repo。
# 這樣歷史資料在 GitHub 上直接可下載，前端讀靜態檔也不吃 Worker 額度。
# 一天只產生一個 commit。

on:
  schedule:
    # UTC 19:00 = 台北 03:00。避開整點與 UTC 00:00，GitHub 排程在熱門時段延遲較嚴重。
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定匯出日期 YYYY-MM-DD（留空 = 前一日）'
        required: false
        type: string
      force:
        description: '允許用比現有檔案更少的資料覆蓋（僅在確知現有檔案有誤時勾選）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write   # 失敗時開 Issue 通知，見檔尾

env:
  # runner 預設 UTC，不設這個的話 date 算出來的「昨天」會在台北時間 08:00 前後錯一天
  TZ: Asia/Taipei
  API_BASE: https://dintaifung-queue.dannynycc.workers.dev

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 決定匯出日期
        id: pick
        # 使用者輸入透過 env 傳入，不直接內插進 shell —— 直接寫 ${{ inputs.date }}
        # 在 run: 區塊裡是標準的 GitHub Actions 指令注入模式。
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          d="${INPUT_DATE:-$(date -d 'yesterday' +%F)}"
          if ! echo "$d" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::日期格式不合法：$d"
            exit 1
          fi
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "匯出日期（台北）：$d"

      - name: 從 D1 撈變化事件
        id: fetch
        run: |
          d="${{ steps.pick.outputs.date }}"
          mkdir -p docs/data
          curl -sS --fail --max-time 60 \
            "$API_BASE/api/changes?date=$d" -o /tmp/day.json
          # 一定要驗型別：若端點回的是 {"error": ...} 這種物件，len() 會是 1
          # 而不是 0，空檔保護就失效，錯誤物件會被當成一天的資料寫進 repo。
          n=$(python3 -c "
          import json, sys
          d = json.load(open('/tmp/day.json'))
          if not isinstance(d, list):
              print(f'::error::/api/changes 回傳的不是陣列：{str(d)[:200]}', file=sys.stderr)
              sys.exit(1)
          print(len(d))
          ")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "取得 $n 筆變化事件"

      - name: 空資料就中止，不要用空檔覆蓋既有檔案
        if: steps.fetch.outputs.count == '0'
        run: |
          echo "::warning::${{ steps.pick.outputs.date }} 沒有任何變化事件，跳過寫入。"
          echo "後續的健康度檢查會判斷這是 cron 中斷還是該日確實無資料。"

      # 暴跌守門。實際事故：2026-08-12 傍晚 17:51 手動觸發測試，把當天只累積到
      # 一半的 43 筆寫進 repo，覆蓋掉原本會有的 225 筆。該日隔天變成歷史日後，
      # 前端優先讀靜態檔，等於 81% 的資料在畫面上消失 —— 而 workflow 全綠。
      # 「比現有檔案少」永遠是可疑的：正常情況只會愈補愈多。
      - name: 資料量暴跌就中止（寧可不更新，也不要覆蓋成殘缺）
        if: steps.fetch.outputs.count != '0'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          d="${{ steps.pick.outputs.date }}"
          f="docs/data/$d.json"
          [ -f "$f" ] || { echo "尚無既有檔案，直接寫入"; exit 0; }
          old=$(python3 -c "import json;print(len(json.load(open('$f'))))")
          new="${{ steps.fetch.outputs.count }}"
          echo "既有 $old 筆 / 這次取得 $new 筆"
          if [ "$new" -lt "$old" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::新資料($new)少於既有($old)，但已勾選 force，仍照常覆蓋。"
            else
              echo "::error::新資料($new 筆)少於既有檔案($old 筆) —— 拒絕覆蓋。"
              echo "常見原因：在當日尚未結束時手動觸發匯出。"
              echo "若確知既有檔案有誤，重新以 force=true 觸發。"
              exit 1
            fi
          fi

      - name: 寫入 docs/data 並重建索引
        if: steps.fetch.outputs.count != '0'
        run: |
          d="${{ steps.pick.outputs.date }}"
          python3 - "$d" <<'PY'
          import json, os, sys
          date = sys.argv[1]
          rows = json.load(open('/tmp/day.json'))
          os.makedirs('docs/data', exist_ok=True)
          with open(f'docs/data/{date}.json', 'w', encoding='utf-8') as f:
              json.dump(rows, f, ensure_ascii=False, separators=(',', ':'))
          dates = sorted(
              f[:-5] for f in os.listdir('docs/data')
              if f.endswith('.json') and f != 'index.json' and len(f) == 15
          )
          with open('docs/data/index.json', 'w', encoding='utf-8') as f:
              json.dump(dates, f, separators=(',', ':'))
          print(f'寫入 {date}.json（{len(rows)} 筆），索引共 {len(dates)} 天')
          PY

      # 刻意「不」加 if 條件：這個診斷步驟最有價值的時刻，正是前一步取得
      # 0 筆資料的時候（代表 Worker cron 可能整天沒跑）。原本它被
      # `if: count != '0'` 擋住，等於在唯一需要它的情況下不執行。
      # 也不加 continue-on-error：真的斷線就該讓這個 job 紅燈，
      # 綠燈加一行沒人看的 warning 等於沒有告警。
      - name: 抓取健康度檢查（cron 是否有漏跑）
        if: always() && steps.pick.outcome == 'success'
        run: |
          if ! curl -sS --fail --max-time 30 "$API_BASE/api/health" -o /tmp/health.json; then
            echo "::error::無法取得 /api/health —— Worker 可能整個掛了"
            exit 1
          fi
          COUNT="${{ steps.fetch.outputs.count }}" python3 - <<'PY'
          import json, os, sys, datetime
          h = json.load(open('/tmp/health.json'))
          if not h:
              print('::error::fetch_health 完全沒有紀錄 —— cron 從未成功執行')
              sys.exit(1)

          # RETRY_OK 是「失敗後自我修復成功」的訊號，不是告警來源。
          # 原本的條件是 `if r['fail_count'] or r['note']`，會把每個重試成功的
          # 週期都誤報成異常 —— 我自己加的 RETRY_OK 觸發了我自己寫的告警。
          def is_bad(r):
              note = r.get('note') or ''
              real = [p for p in note.split(' | ')
                      if p and not p.startswith('RETRY_OK') and not p.startswith('ROLLUP_NOOP')]
              return bool(real)

          bad = [r for r in h if is_bad(r)]
          latest = max(r['timestamp'] for r in h)
          age_min = (datetime.datetime.now() - datetime.datetime.strptime(latest, '%Y-%m-%d %H:%M:%S')).total_seconds() / 60

          print(f'最近一次抓取：{latest}（{age_min:.0f} 分鐘前）')
          print(f'近 {len(h)} 次紀錄中，有實質問題的 {len(bad)} 次')
          for r in bad[:5]:
              print(f"  {r['timestamp']} ok={r['ok_count']} fail={r['fail_count']} {r['note']}")

          # 本 workflow 在台北 03:00 執行，抓取視窗收在 21:30，
          # 所以正常情況下最近一次抓取就是 5.5 小時前（330 分鐘）—— 這是預期值不是異常。
          # 門檻取 420 分鐘：代表昨天比預定時間提早 1.5 小時以上斷線才告警。
          # （抓取視窗若再調整，這個數字要跟著改，否則不是每天誤報就是永遠不報。）
          STALE_LIMIT_MIN = 420
          if age_min > STALE_LIMIT_MIN:
              print(f'::error::最近一次抓取在 {age_min:.0f} 分鐘前（門檻 {STALE_LIMIT_MIN}）—— cron 可能提早中斷')
              sys.exit(1)
          if os.environ.get('COUNT') == '0':
              print('::error::前一日沒有任何變化事件，但 cron 有在跑 —— 請人工確認')
              sys.exit(1)
          PY

      - name: commit
        if: steps.fetch.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "沒有變更，不建立 commit"
          else
            git commit -m "data: ${{ steps.pick.outputs.date }} 候位變化事件（${{ steps.fetch.outputs.count }} 筆）"
            # push 可能撞到另一個同時在跑的 run —— 補匯出多天歷史時特別容易發生，
            # 2026-09-02 補 8/26 與 8/29 就踩到（第二個被 non-fast-forward 打回，
            # 資料明明抓對了卻整個 run 失敗）。各 run 寫的是不同的 docs/data/*.json，
            # 內容本來就不衝突，rebase 後重試即可。
            # 最後一次不包在 if 裡：真的推不上去要讓 step 失敗，不能靜默吞掉。
            for i in 1 2; do
              if git push; then exit 0; fi
              echo "push 被打回（第 $i 次），rebase 後重試"
              git pull --rebase --autostash
            done
            git push
          fi

      # 這個 workflow 從 2026-08-26 起連續失敗了一週（Worker 因 D1 額度超限回 500），
      # 它每天都正確偵測到並 fail —— 但失敗只是靜靜躺在 Actions 頁面，
      # 最後是 Cloudflare 的告警信才讓人發現。偵測得到卻沒人知道，等於沒偵測。
      #
      # 開一張 Issue 才會真的推到通知（GitHub 會寄信、repo 首頁也看得到）。
      # 已經有一張開著就只留言，不要每天開一張新的洗版；修好後手動關掉即可。
      - name: 失敗時開 Issue 通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_DATE: ${{ steps.pick.outputs.date }}
        run: |
          body="匯出失敗。目標日期：\`${TARGET_DATE:-未決定}\`

          Run log：$RUN_URL

          常見原因：
          - Worker 回 500 → 多半是 D1 每日 rows_read（免費 500 萬）超限，UTC 00:00 才重置。
            用 \`npx wrangler d1 execute dintaifung --remote --json --command \"<SQL>\" | grep rows_read\`
            找出掃全表的查詢（見 README「D1 的額度是算讀了幾列」）。
          - push 被 non-fast-forward 打回 → 通常是兩個 run 同時在跑。

          資料本身不會因為這次失敗而遺失（D1 的 wait_changes 沒有清理機制），
          修好後用 workflow_dispatch 指定日期補跑即可。"
          num=$(gh issue list --state open --json number,title \
                  --jq '[.[] | select(.title | startswith("daily-export 失敗")) | .number] | first // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "daily-export 失敗（${TARGET_DATE:-未決定}）" --body "$body"
          fi
